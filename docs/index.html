  refresh: '<path d="M19 12a7 7 0 1 1-2.1-5M19 4.5V8h-3.5"/>',
  play:    '<path d="M8 5.5v13l10-6.5-10-6.5Z"/>',
  mic:     '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/>',
  undo:    '<path d="M9 7.5 4.5 12 9 16.5M5 12h9.5a5 5 0 0 1 0 10H12"/>',
};
const icon = (name, size = 20) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON_PATHS[name] || ''}</svg>`;

const dayLabel = ts => new Date(ts).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
const scoreTone = s => typeof s !== 'number' ? 'var(--dim)' : s >= 72 ? 'var(--good)' : s >= 58 ? 'var(--dawn)' : 'var(--bad)';

App.render = function () {
  const s = this.screen;
  const app = el('app');
  const fresh = s !== this._rendered;
  this._rendered = s;
  app.innerHTML = this['view_' + s] ? this['view_' + s]() : '<p class="lede">…</p>';
  /* the bedroom is dark: the browser chrome goes black with the tracking screen */
  const tc = document.querySelector('meta[name="theme-color"]');
  if (tc) tc.setAttribute('content', s === 'tracking' ? '#000000' : getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() || '#100D0B');
  const scr = app.querySelector('.screen');
  if (scr && fresh && s !== 'tracking' && s !== 'alarm') scr.classList.add(s === 'morning' ? 'reveal' : 'enter');
  if (this['after_' + s]) this['after_' + s]();
};

/* A top bar: the mark on the left, or a way back. */
App._bar = function (left, right = '') {
  return `<div class="bar">${left}<div class="bar-actions">${right}</div></div>`;
};
App._mark = () => `<span class="mark">${icon('moon', 20)}Small Hours</span>`;
App._backBtn = (id = 'btnBack', label = 'Tonight') => `<button class="iconbtn" id="${id}" style="padding-left:4px">${icon('back')}${esc(label)}</button>`;

/* --- setup: the sensor check IS the onboarding --------------------------- */
App.view_setup = function () {
  const r = this.settings.sensors;
  const line = (ic, name, res, note) => {
    const state = !res ? '<span class="state idle">not checked</span>'
      : `<span class="state ${res.ok ? 'ok' : 'off'}">${res.ok ? 'working' : 'unavailable'}</span>`;
    const why = !res ? '' : res.ok ? (note ? `<span class="why">${esc(note)}</span>` : '') : `<span class="why">${esc(res.why || '')}</span>`;
    return `<div class="sense">${icon(ic)}<span>${esc(name)}</span>${state}${why}</div>`;
  };
  return `<div class="screen on">
    ${this._bar(this._mark())}
    <div class="stack" style="gap:14px">
      <h1>First, one check.</h1>
      <p class="lede">A web page can only reach your sensors if the browser says yes, so allow motion and microphone access when asked. It takes about five seconds and shows exactly what tonight will look like. Nothing is recorded during the check.</p>
    </div>
    <div class="list">
      ${line('motion', 'Movement', r && r.motion, r && r.motion && r.motion.ok ? `about ${r.motion.rate} readings a second` : '')}
      ${line('sound', 'Sound', r && r.audio, 'analysed on the phone; nothing is uploaded')}
      ${line('screen', 'Screen stays awake', r && r.wake)}
    </div>
    ${r ? this._setupVerdict(r) : ''}
    <div class="spacer"></div>
    <div class="stack">
      <button class="btn ${r ? 'quiet' : 'primary huge'} wide" id="btnProbe">${r ? `${icon('refresh')}Check again` : 'Run the check'}</button>
      ${r ? `<button class="btn primary wide huge" id="btnSetupDone">Continue</button>` : ''}
    </div>
    <p class="caveat">Movement is the one that matters most. If it is unavailable, the app still works — it scores your night from your times instead, and shows how you felt next to it.</p>
  </div>`;
};
App._setupVerdict = function (r) {
  const m = r.motion && r.motion.ok;
  const a = r.audio && r.audio.ok;
  let head, body, extra = '';
  if (m && a)      { head = 'Everything works.'; body = 'The full thing: movement, sound, a night curve and a smart alarm that waits for a light moment.'; }
      else if (m)      { head = 'Movement works.';   body = 'That is the one that matters. Sound did not open this time; it is tried again every time you start a night, and the Sound check on the next screen shows whether it is working.'; }
  else {
    head = 'Movement is not available here.';
    body = 'Small Hours reads your night through the mattress, so it needs a phone with a motion sensor, the page open in the browser over HTTPS, and Motion access allowed. A laptop or desktop has no motion sensor, so this result is expected there.';
    extra = `<p class="caveat" style="margin-top:12px">Without movement Small Hours runs as a <strong>sleep log and alarm</strong>: tap when you go to bed, tap when you wake, answer one question. It scores the night on length, on how steady your hours are, and shows how rested you felt next to it. That is a real score — just a simpler one, capped and labelled as an estimate.</p>
    <p class="caveat" style="margin-top:10px">On an iPhone that said no by mistake: reload the page and tap "Check again" — Safari asks again on a new visit. If it stops asking, clear this site under Settings → Apps → Safari → Advanced → Website Data.</p>`;
  }
  return `<div class="panel ${m ? '' : 'warm'}"><h2 style="margin-bottom:8px">${esc(head)}</h2><p class="caveat">${esc(body)}</p>${extra}</div>`;
};
App.after_setup = function () {
  el('btnProbe').onclick = async () => {
    el('btnProbe').textContent = 'Checking…';
    el('btnProbe').disabled = true;
    const motion = await Signal.probeMotion();
    const audio  = await Signal.probeAudio();
    const wake   = await Signal.probeWakeLock();
    this.settings.sensors = { motion, audio, wake };
    await this.save();
    this.render();
  };
  const d = el('btnSetupDone');
  if (d) d.onclick = async () => { this.settings.setupDone = true; await this.save(); this.go('home'); };
};

/* --- home / bedtime ------------------------------------------------------ */
App.view_home = function () {
  const last = this.history[0];
  const b = this.baseline || { nights: 0 };
  const [h, m] = (this.settings.alarmTime || '07:00').split(':').map(Number);
  const backstop = `${pad2((h + (m + 10 >= 60 ? 1 : 0)) % 24)}:${pad2((m + 10) % 60)}`;
  const sens = this.settings.sensors || {};
  const motionOK = !!(sens.motion && sens.motion.ok);
  const wakeOK = !!(sens.wake && sens.wake.ok);
  const win = motionOK ? +this.settings.windowMin || 0 : 0;
  const alarmAt = `${pad2(h)}:${pad2(m)}`;
  const fromMin = (h * 60 + m - win + 1440) % 1440;
  const from = `${pad2(Math.floor(fromMin / 60))}:${pad2(fromMin % 60)}`;
  const n = this.history.length;

  return `<div class="screen on">
    ${this._bar(this._mark(), `
      ${n ? `<button class="iconbtn" id="btnHistory" aria-label="All nights, ${n} saved">${icon('nights')}<span class="num">${n}</span></button>` : ''}
      <button class="iconbtn" id="btnData" aria-label="Your data, settings and install">${icon('data')}</button>`)}

    ${last ? `<button class="lastnight" id="btnLast">
        <span style="display:flex;align-items:center;gap:14px;min-width:0">
          <span class="big num" style="color:${scoreTone(last.score)}">${last.score != null ? last.score : '—'}</span>
          <span style="display:flex;flex-direction:column;min-width:0"><span style="font-weight:500;color:var(--ink-strong)">Last night</span>
          <span class="meta">${last.score != null ? `${esc(durShort(last.asleepMs || 0))} asleep` : 'unreadable'}</span></span>
        </span>
        <span class="go">See it${icon('chevron', 18)}</span>
      </button>` : `<h1>Put the phone on the mattress. That is the whole setup.</h1>`}

    <div class="wake">
      <label class="label" for="alarmTime">Wake me by</label>
      <input type="time" id="alarmTime" value="${esc(this.settings.alarmTime)}">
    </div>

    ${motionOK ? `<div class="stack" style="gap:8px">
      <div class="seg" role="radiogroup" aria-label="Wake window" id="win">
        ${[[0, 'On time'], [20, '20 min'], [30, '30 min'], [45, '45 min']].map(([v, l]) =>
          `<button role="radio" aria-checked="${win === v}" data-w="${v}">${l}</button>`).join('')}
      </div>
      <p class="seg-note">${win > 0 ? `Rings at a light moment between <strong class="num">${from}</strong> and <strong class="num">${alarmAt}</strong>.` : `Rings at exactly <strong class="num">${alarmAt}</strong>.`}</p>
    </div>` : ''}

    <div class="safety">
      ${!wakeOK ? `<p class="must">${icon('lock', 18)}<span><strong>Set Auto-Lock to Never tonight.</strong> This browser will not keep the screen awake, and if the phone locks, the page stops and so does the alarm. Settings → Display &amp; Brightness → Auto-Lock.</span></p>` : ''}
      <p>${icon('bell', 18)}<span>Keep a backup alarm on your phone's own clock for <strong class="num">${backstop}</strong>. Treat this one as the nice alarm, never the only one.</span></p>
      ${!motionOK ? `<p>${icon('alert', 18)}<span>No movement on this device, so tonight is a sleep log: scored on your times, with how rested you feel next to it. <button class="linkish" id="btnRecheck" style="min-height:0;padding:0">Check sensors again</button></span></p>` : ''}
    </div>

    <div class="soundcheck" id="soundCheck">
      <div class="row2"><h3>Sound check</h3><button class="btn quiet" id="btnSound" style="min-height:44px;padding:8px 16px">${icon('mic', 18)}Check</button></div>
      <div class="meter" aria-hidden="true"><i id="soundMeter"></i></div>
      <p class="why" id="soundWhy" role="status">${esc(this._soundMsg || 'Five seconds, before bed: make a sound — the bar should move.')}</p>
    </div>

    <button class="toggle" role="switch" aria-checked="${!!this.settings.saveClips}" id="btnClips">
      <span class="t">Save short clips of snores and coughs — kept on this phone only</span><span class="sw" aria-hidden="true"></span>
    </button>

    <div class="spacer"></div>
    <button class="btn primary wide huge" id="btnStart">${icon('moon', 22)}Start the night</button>

    <div class="stack" style="gap:14px;margin-top:12px">
      <h2>Before you put it down</h2>
      <ol class="checklist">
        <li>Plug the phone in.</li>
        <li><strong>Ringer on, volume up.</strong> A web page cannot turn either one up for you — that is what the test below is for.</li>
        ${wakeOK ? '<li>Auto-Lock to Never is belt and braces: Settings → Display &amp; Brightness → Auto-Lock.</li>' : ''}
        ${motionOK ? '<li>Phone flat on the mattress, screen down, near your hip. Not on the nightstand — it has to feel you move.</li>' : '<li>Leave this page open and the phone face down. Anywhere is fine tonight; nothing is being sensed.</li>'}
      </ol>
      <button class="btn quiet wide" id="btnTest">${icon('speaker')}Test the alarm sound</button>
      <p class="caveat">${b.nights >= 3 ? `Your usual middle of the night is <span class="num">${pad2(Math.floor(b.midMinutes / 60))}:${pad2(b.midMinutes % 60)}</span>, across ${b.nights} nights.` : 'After three nights this starts scoring how steady your hours are.'}</p>
    </div>
  </div>`;
};
App.after_home = function () {
  el('alarmTime').onchange = async e => { if (!e.target.value) return; this.settings.alarmTime = e.target.value; await this.save(); this.render(); };
  const w = el('win');
  if (w) w.querySelectorAll('[data-w]').forEach(btn => {
    btn.onclick = async () => { this.settings.windowMin = +btn.dataset.w; await this.save(); this.render(); };
  });
  el('btnTest').onclick = async () => { await Alarm.unlock(); Alarm.test(); el('btnTest').textContent = 'Heard it? Then you are set.'; };
  el('btnStart').onclick = () => this.startNight();
  el('btnClips').onclick = async () => { this.settings.saveClips = !this.settings.saveClips; await this.save(); el('btnClips').setAttribute('aria-checked', String(!!this.settings.saveClips)); };
  el('btnSound').onclick = async () => {
    const b = el('btnSound'), bar = el('soundMeter'), why = el('soundWhy');
    b.disabled = true; why.textContent = 'Listening for five seconds — make a sound, the bar should move.';
    let lo = 0, hi = -140;
    const r = await Signal.soundCheck(db => {
      if (db < lo) lo = db; if (db > hi) hi = db;
      if (bar) bar.style.transform = `scaleX(${clamp((db + 80) / 60, 0.02, 1).toFixed(2)})`;
    }, 5000);
    if (bar) bar.style.transform = 'scaleX(0)';
    b.disabled = false;
    this._soundMsg = !r.ok ? r.why
      : r.range >= 12 ? `Working. The room sat near ${r.min} dB and your sound reached ${r.max} dB — tonight will hear it.`
      : `The microphone is open but the level barely moved (${r.min} to ${r.max} dB). Try again and make a louder sound, close to the phone.`;
    this._soundCheck = r;
    if (el('soundWhy')) el('soundWhy').textContent = this._soundMsg;
  };
  const hb = el('btnHistory'); if (hb) hb.onclick = () => this.go('history');
  const lb = el('btnLast'); if (lb) lb.onclick = () => { this.night = this.history[0]; this.night._res = Scorer.compute(this.night, this.baseline); this.go('morning'); };
  const rb = el('btnRecheck'); if (rb) rb.onclick = () => this.go('setup');
  el('btnData').onclick = () => this.go('data');
};

/* --- resume an interrupted night ---------------------------------------- */
App.view_resume = function () {
  const s = this.session;
  return `<div class="screen on">
    ${this._bar(this._mark())}
    <h1>A night was still running.</h1>
    <p class="lede">It started at <span class="num">${hhmm(s.startAt)}</span>, ${dur(Date.now() - s.startAt)} ago. The page reloaded, so sensing stopped — but the readings up to that point were saved.</p>
    <div class="spacer"></div>
    <button class="btn primary wide huge" id="btnFinish">Finish it and score it</button>
    <button class="btn quiet wide" id="btnDiscard">Throw it away</button>
  </div>`;
};
App.after_resume = function () {
  el('btnFinish').onclick = async () => {
    Signal._epochs = (this.session.epochs || []);
    await this.endNight();
  };
  el('btnDiscard').onclick = () => { try { localStorage.removeItem(`${APP}:live`); } catch (_) {} this.session = null; this.go('home'); };
};

/* --- tracking: the darkest screen we can draw ---------------------------- */
App.view_tracking = function () {
  const s = this.session;
  const t = new Date(s.target);
  return `<div class="screen on" id="s-tracking">
    <div class="night-top">
      <span class="night-mark" role="img" aria-label="Still listening"></span>
      <p class="night-clock" id="nightClock">${hhmm(s.startAt)} — 0h 00m</p>
      <p class="night-line">${s.windowMin > 0 ? `Waking you by ${pad2(t.getHours())}:${pad2(t.getMinutes())}, from ${s.windowMin} min before` : `Alarm at ${pad2(t.getHours())}:${pad2(t.getMinutes())}`}</p>
      <p class="night-small">${s.windowMin > 0 ? 'Reading the bed' : 'Logging times'}</p>
      <div class="night-sound" aria-live="off"><span class="nbar" aria-hidden="true"><i id="nightSound"></i></span><span class="night-small" id="nightSoundTxt" style="opacity:.8">starting the microphone…</span></div>
    </div>
    <div class="spacer"></div>
    <button class="btn wide" id="btnEnd">I'm awake — end the night</button>
    <p class="night-small" style="margin-top:14px">Leave this open. Screen down.</p>
  </div>`;
};
App.after_tracking = function () {
  this._soundTick();
  let armed = false;
  const b = el('btnEnd');
  b.onclick = () => {
    if (!armed) { armed = true; b.textContent = 'Tap again to confirm'; setTimeout(() => { armed = false; b.textContent = "I'm awake — end the night"; }, 4000); return; }
    this.endNight();
  };
};

/* --- alarm: hold two seconds to get up ----------------------------------- */
App.view_alarm = function () {
  return `<div class="screen on" style="justify-content:center;text-align:center;gap:20px">
    <div class="spacer"></div>
    <p class="alarm-time num">${hhmm(Date.now())}</p>
    <h1 style="font-size:36px">Good morning.</h1>
    <p class="lede" style="margin:0 auto">Hold the button for two seconds. That is on purpose.</p>
    <div class="spacer"></div>
    <button class="btn primary wide huge hold" id="btnUp" role="button" aria-describedby="holdHint"><span class="fill"></span><span id="holdLabel">${icon('sun', 24)}Hold to get up</span></button>
    <p class="hold-hint" id="holdHint" aria-live="polite">&nbsp;</p>
    <button class="btn quiet wide" id="btnSnooze">Nine more minutes</button>
  </div>`;
};
App.after_alarm = function () {
  const b = el('btnUp'), label = el('holdLabel'), hint = el('holdHint');
  let timer = null, tick = null, held = 0;
  const reset = () => { b.classList.remove('holding'); label.innerHTML = `${icon('sun', 24)}Hold to get up`; };
  const startHold = e => {
    e.preventDefault();
    held = Date.now();
    b.classList.add('holding');
    label.textContent = 'Keep holding…';
    hint.textContent = '2';
    clearInterval(tick);
    tick = setInterval(() => { const left = Math.ceil((2000 - (Date.now() - held)) / 1000); if (left > 0) hint.textContent = String(left); }, 250);
    timer = setTimeout(() => { clearInterval(tick); label.textContent = 'Up.'; hint.textContent = 'Good morning.'; this.endNight(); }, 2000);
  };
  const endHold = () => {
    clearTimeout(timer); clearInterval(tick);
    if (Date.now() - held < 2000) { reset(); hint.textContent = held ? 'Not quite — hold for the full two seconds.' : '\u00a0'; }
  };
  b.addEventListener('pointerdown', startHold);
  b.addEventListener('pointerup', endHold);
  b.addEventListener('pointercancel', endHold);
  b.addEventListener('pointerleave', endHold);
  b.addEventListener('contextmenu', e => e.preventDefault());
  el('btnSnooze').onclick = () => {
    Alarm.silence();
    Alarm.target = Date.now() + 9 * 60000;
    Alarm.windowMin = 0; Alarm.armed = true;
    this.go('tracking');
  };
};
</script>
<script>
/* --- morning: the score, and why ---------------------------------------- */
App.view_morning = function () {
  const n = this.night;
  if (!n) return `<div class="screen on"><p class="lede">No night to show.</p><button class="btn wide" id="btnHome2">Back</button></div>`;
  const res = n._res || Scorer.compute(n, this.baseline);
  const b = this.baseline || { nights: 0 };
  const when = `${esc(dayLabel(n.wakeAt))} · <span class="num">${esc(hhmm(n.bedAt))} → ${esc(hhmm(n.wakeAt))}</span>`;

  if (!n.ok || res.total == null) {
    return `<div class="screen on">
      ${this._bar(`<span class="label">${when}</span>`)}
      <h1>I couldn't read that night.</h1>
      <p class="lede">${esc(n.reason || 'The signal was not usable.')}</p>
      <div class="panel"><p class="caveat">No score is better than a made-up one. The times are saved — ${esc(dur(n.inBedMs))} in bed. Nothing to make up for; tonight just runs as normal.</p></div>
      ${this._soundsPanel(n)}
      <div class="spacer"></div>
      <button class="btn primary wide" id="btnHome2">Back to tonight</button>
    </div>`;
  }

  const delta = b.avgScore != null && this.history.length > 1 ? res.total - b.avgScore : null;
  const rowsHtml = res.rows.filter(r => !r.skipped).map((r, i) => `
    <div class="comp">
      <span class="comp-name">${esc(r.name)}</span>
      <span class="comp-val">${esc(r.show ? r.show(n, b) : '')}</span>
      <span class="comp-track"><span class="comp-fill ${bandColor(r.value)}" style="width:${Math.round(r.value * 100)}%;--i:${i}"></span></span>
    </div>`).join('');
  const skipped = res.rows.filter(r => r.skipped);
  const conf = res.confidence >= .85 ? 'ok' : res.confidence >= .6 ? 'warn' : 'off';

  return `<div class="screen on">
    ${this._bar(`<span class="label">${when}</span>`, `<span class="confpill ${conf}">${esc(res.confLabel)}</span>`)}

    <div>
      <div class="score-wrap">
        <span class="score" aria-label="Score ${res.total} out of 100">${res.total}</span>
        <span class="score-of">out of 100${delta != null ? `<b>${delta >= 0 ? '+' : '−'}${Math.abs(delta)} on your average</b>` : ''}</span>
      </div>
      <div class="verdict-block" style="margin-top:22px">
        <p class="verdict">${esc(res.band[1])}</p>
        <p class="lede" style="margin-top:6px">${esc(res.band[2])}</p>
      </div>
    </div>

    ${res.worst ? `<div class="cost">${icon('alert')}<div class="stack" style="gap:6px">
      <h2>What cost you the most: ${esc(res.worst.name.toLowerCase())}, <span class="pts num">${Math.round(res.worst.lost)} points</span>.</h2>
      <p class="caveat" style="color:var(--ink)">${esc(res.worst.lever)}</p>
    </div></div>` : `<div class="cost">${icon('sun')}<p class="caveat" style="color:var(--ink)">Nothing stands out as the problem — the points are spread evenly. That is what a good night looks like.</p></div>`}

    ${n.estimated || !(n.depth && n.depth.length) ? `<div class="panel"><h3 style="margin-bottom:6px">Sleep log</h3><p class="caveat">No movement was read, so there is no night curve. This score comes from your times alone — ${esc(durShort(n.inBedMs))} in bed, sleep estimated — and is capped at 78.</p></div>` : `<div class="stack" style="gap:10px">
      <h3>The night</h3>
      <canvas class="hypno" id="hypno"></canvas>
      <div class="hypno-legend">
        <span><i style="background:var(--dawn)"></i>awake</span>
        <span><i style="background:var(--deep);opacity:.45"></i>restless</span>
        <span><i style="background:var(--deep)"></i>settled</span>
        <span class="total">${esc(durShort(n.asleepMs))} asleep of ${esc(durShort(n.inBedMs))}</span>
      </div>
    </div>`}

    <div class="panel"><h3 style="margin-bottom:16px">Where the points came from</h3>${rowsHtml}
    ${skipped.length ? `<p class="caveat" style="margin-top:18px">Not scored yet: ${esc(skipped.map(r => r.name.toLowerCase()).join(', '))}. ${skipped.some(r => r.key === 'timing') ? 'Steadiness needs three nights before it means anything.' : ''}</p>` : ''}
    </div>

    ${this._soundsPanel(n)}

    <div class="stack" style="gap:12px">
      <h2>How rested do you actually feel?</h2>
      <div class="rested" id="restedRow" role="radiogroup" aria-label="How rested you feel">
        ${[['1', 'Wrecked'], ['2', 'Meh'], ['3', 'Fine'], ['4', 'Great']].map(([v, l]) =>
          `<button class="btn ${n.rested == v ? 'primary' : ''}" role="radio" aria-checked="${n.rested == v}" data-r="${v}">${l}</button>`).join('')}
      </div>
      ${n.rested ? `<p class="caveat" role="status">${esc(this._restedNote(res.total, +n.rested))}</p>` : ''}
    </div>

    <p class="caveat">This is a phone on a mattress, not a sleep lab. It measures how still you were and how quiet the room was. It deliberately does not claim REM or deep sleep: movement alone cannot tell those apart, and apps that show them are drawing a textbook diagram, not your night. Read this for patterns across weeks, not for any single number.</p>
    <div class="row">
      <button class="btn quiet" id="btnHist2">${icon('nights', 18)}All nights</button>
      <button class="btn primary" id="btnHome2">Done</button>
    </div>
  </div>`;
};
App._soundsPanel = function (n) {
  if (n.soundMode === 'events') {
    const snore = Math.round(n.snoreMinDet || 0);
    return `<div class="panel stack" style="gap:16px" id="soundsPanel">
      <h3>Sounds</h3>
      <div class="stat3">
        <div><span class="v num">${snore}</span><span class="k">snore minute${snore === 1 ? '' : 's'}</span></div>
        <div><span class="v num">${n.coughs || 0}</span><span class="k">cough${n.coughs === 1 ? '' : 's'}</span></div>
        <div><span class="v num">${n.coughFits || 0}</span><span class="k">coughing fit${n.coughFits === 1 ? '' : 's'}</span></div>
      </div>
      <canvas class="sndline" id="sndline" aria-label="When in the night the sounds happened"></canvas>
      <div class="hypno-legend"><span><i style="background:var(--deep)"></i>snore</span><span><i style="background:var(--dawn)"></i>cough</span><span><i style="background:var(--edge)"></i>other noise (${n.otherNoises || 0})</span></div>
      <div class="clips" id="clipList"></div>
      <p class="caveat">A snore here is a low, breath-long sound repeating at breathing pace; a cough is a short explosive burst. A phone in a dark room gets some wrong — the clips, if you saved them, let you check.</p>
    </div>`;
  }
  if (n.hadAudio && n.snoreMinutes >= 15) return `<div class="panel"><h3 style="margin-bottom:6px">Sound</h3><p class="caveat">Roughly ${n.snoreMinutes} minutes of steady low-frequency sound while you were asleep — that pattern is usually snoring. Worth knowing, not worth worrying about on its own.</p></div>`;
  return '';
};
function drawSoundLine(canvas, n) {
  const cs = getComputedStyle(document.documentElement), tok = k => cs.getPropertyValue(k).trim();
  const dpr = Math.min(window.devicePixelRatio || 1, 2), W = canvas.clientWidth || 300, H = 54;
  canvas.width = W * dpr; canvas.height = H * dpr; canvas.style.height = H + 'px';
  const g = canvas.getContext('2d'); g.scale(dpr, dpr); g.clearRect(0, 0, W, H);
  const a = n.bedAt != null ? n.bedAt : n.startAt, b = n.wakeAt != null ? n.wakeAt : n.endAt, span = Math.max(1, b - a);
  const x = t => 2 + clamp((t - a) / span, 0, 1) * (W - 4);
  g.fillStyle = tok('--line'); g.fillRect(0, 30, W, 1);
  const rows = { s: [12, tok('--deep')], c: [22, tok('--dawn')], o: [34, tok('--edge')] };
  for (const [t, k] of (n.soundEvents || [])) { const r = rows[k]; if (!r) continue; g.fillStyle = r[1]; g.globalAlpha = k === 'o' ? .6 : .85; g.fillRect(Math.round(x(t)), r[0] - 4, 2, 8); }
  g.globalAlpha = 1; g.fillStyle = tok('--dim'); g.font = '11px "IBM Plex Sans", sans-serif'; g.textAlign = 'center';
  const hours = Math.max(1, Math.round(span / 3600000)), step = hours > 6 ? 2 : 1;
  for (let h = 0; h <= hours; h += step) { const t = a + h * 3600000; if (t > b) break; const px = x(t); if (px > 14 && px < W - 14) g.fillText(hhmm(t), px, H - 2); }
}
App._renderClips = async function (n) {
  const box = el('clipList'); if (!box || !Clips.ok()) return;
  let list = [];
  /* clips carry the recorder's own start stamp, a few ms off bedAt: match
     by the night's time span instead */
  try { list = (await Clips.all()).filter(c => c.t >= n.bedAt - 60000 && c.t <= (n.wakeAt || Date.now()) + 60000).sort((a, b) => a.t - b.t); } catch (_) { return; }
  if (!list.length) { box.innerHTML = this.settings.saveClips ? '<p class="caveat">No clips were saved last night.</p>' : ''; return; }
  const label = c => c.type === 'cough' ? 'Cough' : c.type === 'snore' ? 'Snore' : 'Other noise';
  box.innerHTML = `<h3 style="font-size:15px;margin-bottom:4px">Clips on this phone (${list.length})</h3>` + list.map(c => `<div class="clip" data-id="${c.id}">
      <button class="iconbtn play" data-play="${c.id}" aria-label="Play the ${esc(label(c).toLowerCase())} at ${esc(hhmm(c.t))}">${icon('play', 18)}</button>
      <span style="display:flex;flex-direction:column;min-width:0"><span class="when num">${esc(hhmm(c.t))} · ${esc(label(c))}</span><span class="what">${esc(c.secs)} s${c.was ? ` · was ${esc(c.was)}` : ''}</span></span>
      <span class="acts">${c.type !== 'other' ? `<button class="iconbtn" data-relabel="${c.id}" aria-label="Not a ${esc(c.type)}">${icon('undo', 16)}not a ${esc(c.type)}</button>` : ''}<button class="iconbtn" data-del="${c.id}" aria-label="Delete this clip">${icon('trash', 16)}</button></span>
    </div>`).join('');
  box.querySelectorAll('[data-play]').forEach(btn => btn.onclick = () => {
    const c = list.find(x => x.id === +btn.dataset.play); if (!c) return;
    if (this._clipAudio) { try { this._clipAudio.pause(); URL.revokeObjectURL(this._clipAudio.src); } catch (_) {} }
    const au = this._clipAudio = new Audio(URL.createObjectURL(new Blob([c.wav], { type: 'audio/wav' })));
    au.setAttribute('playsinline', ''); au.id = 'clipAudio';
    const p = au.play(); if (p && p.catch) p.catch(() => {});
  });
  box.querySelectorAll('[data-del]').forEach(btn => btn.onclick = async () => { await Clips.remove(+btn.dataset.del); this._renderClips(n); });
  box.querySelectorAll('[data-relabel]').forEach(btn => btn.onclick = async () => {
    const c = await Clips.relabel(+btn.dataset.relabel, 'other');
    if (c) await this._relabelNight(n, c);
    this._renderClips(n);
  });
};
/* "not a snore/cough": move that event to other noise in the saved night */
App._relabelNight = async function (n, c) {
  const key = dayKey(n.wakeAt), doc = await Store.get(`nights/${key}`);
  const k = c.was === 'cough' ? 'c' : 's';
  const fix = d => {
    if (!d || !Array.isArray(d.soundEvents)) return d;
    let best = -1, bd = 3000;
    d.soundEvents.forEach((e, i) => { if (e[1] === k && Math.abs(e[0] - c.t) < bd) { bd = Math.abs(e[0] - c.t); best = i; } });
    if (best < 0) return d;
    d.soundEvents[best] = [d.soundEvents[best][0], 'o'];
    d.otherNoises = (d.otherNoises || 0) + 1;
    if (k === 'c') { d.coughs = Math.max(0, (d.coughs || 0) - 1); d.coughFits = soundFits(d.soundEvents); }
    else { const ep = new Set(d.soundEvents.filter(e => e[1] === 's').map(e => Math.floor(e[0] / EPOCH_MS))); d.snoreMinDet = +(ep.size * EPOCH_MS / 60000).toFixed(1); }
    return d;
  };
  fix(n);
  if (doc) await Store.set(`nights/${key}`, fix(doc));
  this.history = await Store.recent('nights', 30);
  const sp = el('soundsPanel');
  if (sp) { sp.outerHTML = this._soundsPanel(n); const c2 = el('sndline'); if (c2) drawSoundLine(c2, n); }
};
App._restedNote = function (score, rested) {
  const felt = rested * 25 - 12;             // 13 / 38 / 63 / 88
  const gap = score - felt;
  if (gap > 25) return 'The night measured better than it felt. When that keeps happening, the cause is usually something other than sleep — timing, light in the morning, or what happens in the first hour after waking.';
  if (gap < -25) return 'You felt better than the night measured. Worth trusting your own read on this one.';
  return 'That matches what the night measured.';
};
App.after_morning = function () {
  const c = el('hypno');
  if (c) { drawHypnogram(c, this.night); window.addEventListener('resize', () => drawHypnogram(c, this.night), { once: true }); }
  const sl = el('sndline');
  if (sl) drawSoundLine(sl, this.night);
  if (this.night && this.night.soundMode === 'events') this._renderClips(this.night);
  const row = el('restedRow');
  if (row) row.querySelectorAll('button').forEach(btn => { btn.onclick = () => this.setRested(btn.dataset.r); });
  const h = el('btnHome2'); if (h) h.onclick = () => this.go('home');
  const h2 = el('btnHist2'); if (h2) h2.onclick = () => this.go('history');
};

/* --- history ------------------------------------------------------------- */
App.view_history = function () {
  const hs = this.history.filter(n => n && n.wakeAt);
  this._patternsFor = hs;
  const b = this.baseline || { nights: 0 };
  if (!hs.length) return `<div class="screen on">${this._bar(this._backBtn())}<h1>No nights yet.</h1><p class="lede">The first one lands here tomorrow morning.</p><div class="spacer"></div><button class="btn primary wide" id="btnBack2">Back to tonight</button></div>`;

  const scored = hs.filter(n => typeof n.score === 'number');
  const recent = hs.slice(0, 14).reverse();
  const cols = recent.map(n => {
    const h = typeof n.score === 'number' ? Math.max(4, n.score) : 4;
    const lbl = new Date(n.wakeAt).toLocaleDateString('en-GB', { weekday: 'narrow' });
    return `<span class="col" title="${esc(dayLabel(n.wakeAt))}: ${typeof n.score === 'number' ? n.score : 'no score'}">
      <span class="bw"><span class="b" style="height:${h}%;background:${typeof n.score === 'number' ? scoreTone(n.score) : 'var(--surface-2)'}"></span></span>
      <span class="d">${esc(lbl)}</span></span>`;
  }).join('');
  const avgLine = b.avgScore != null ? `<span class="avg" style="bottom:calc(19px + ${b.avgScore}px)"><span>avg ${b.avgScore}</span></span>` : '';

  return `<div class="screen on">
    ${this._bar(this._backBtn(), `<button class="iconbtn" id="btnData2" aria-label="Your data">${icon('data')}</button>`)}
    <div class="stack" style="gap:10px">
      <h1>${scored.length} scored night${scored.length === 1 ? '' : 's'}.</h1>
      ${b.avgScore != null ? `<p class="lede">Your average is <strong style="color:var(--dawn)">${b.avgScore}</strong>, on ${esc(durShort(b.avgAsleepMs || 0))} of sleep a night.</p>` : ''}
    </div>
    <div class="panel">
      <div class="chart" role="img" aria-label="Scores for the last ${recent.length} nights">${avgLine}${cols}</div>
      <div class="key"><span><i style="background:var(--good)"></i>72 and up</span><span><i style="background:var(--dawn)"></i>58–71</span><span><i style="background:var(--bad)"></i>under 58</span></div>
    </div>
    ${this._patternsPanel(hs)}
    <div class="list">
      ${hs.map(n => `<button class="night-row" data-day="${esc(n.id || '')}">
        <span style="display:flex;flex-direction:column;min-width:0">
          <span class="day">${esc(dayLabel(n.wakeAt))}</span>
          <span class="sub num">${esc(hhmm(n.bedAt))} → ${esc(hhmm(n.wakeAt))} · ${esc(durShort(n.asleepMs || 0))} asleep</span>
        </span>
        <span class="s" style="color:${scoreTone(n.score)}">${typeof n.score === 'number' ? n.score : '—'}</span>
        ${icon('chevron', 18)}
      </button>`).join('')}
    </div>
    <button class="btn primary wide" id="btnBack2">Back to tonight</button>
  </div>`;
};
App._patternsPanel = function (hs) {
  const p = Patterns.compute(hs);
  if (!p.enough) return `<div class="panel" id="patterns"><h3 style="margin-bottom:6px">Patterns</h3><p class="caveat">Patterns across nights start after ${Patterns.MIN} nights — ${p.need} more to go.</p></div>`;
  return `<div class="panel patterns" id="patterns"><h3 style="margin-bottom:12px">Patterns, across ${p.have} nights</h3>
    ${p.lines.map(l => `<p class="caveat" style="color:var(--ink)">${esc(l)}</p>`).join('')}
    <p class="caveat">${esc(p.gp)}</p></div>`;
};
App.after_history = function () {
  el('btnBack').onclick = () => this.go('home');
  const b2 = el('btnBack2'); if (b2) b2.onclick = () => this.go('home');
  const d2 = el('btnData2'); if (d2) d2.onclick = () => this.go('data');
  document.querySelectorAll('[data-day]').forEach(btn => {
    btn.onclick = () => {
      const n = this.history.find(x => (x.id || '') === btn.dataset.day);
      if (!n) return;
      this.night = { ...n, _res: Scorer.compute(n, this.baseline) };
      this.go('morning');
    };
  });
};

/* ============================================================================
   YOUR DATA — export, import, delete
   Nights live in this browser's localStorage and nowhere else. Export writes
   them to a JSON file you keep; Import reads that file on another device.
   Nothing is uploaded: the file never leaves the device unless you move it.
   ========================================================================== */
const EXPORT_FORMAT = 'smallhours-nights';
const NIGHT_ID = /^\d{4}-\d{2}-\d{2}(-\d{1,3})?$/;
const STATES = new Set(['awake', 'restless', 'settled']);

/* An imported file is untrusted input: keep only known fields of the right type. */
function cleanNight(n) {
  if (!n || typeof n !== 'object') return null;
  const num = v => (typeof v === 'number' && isFinite(v) ? v : null);
  const out = {
    ok: n.ok === true, reason: typeof n.reason === 'string' ? n.reason.slice(0, 400) : null,
    score: num(n.score) == null ? null : Math.round(clamp(n.score, 0, 100)),
    confidence: num(n.confidence) == null ? 0 : clamp(n.confidence, 0, 1),
    bedAt: num(n.bedAt), wakeAt: num(n.wakeAt), inBedMs: num(n.inBedMs), asleepMs: num(n.asleepMs) || 0,
    latencyMs: num(n.latencyMs), wasoMs: num(n.wasoMs), awakenings: num(n.awakenings),
    estimated: n.estimated === true, efficiency: num(n.efficiency), deepMs: num(n.deepMs),
    deepShare: num(n.deepShare), midSleep: num(n.midSleep), coverage: num(n.coverage) || 0,
    hadMotion: n.hadMotion === true, hadAudio: n.hadAudio === true, snoreMinutes: num(n.snoreMinutes) || 0,
    soundMode: n.soundMode === 'events' || n.soundMode === 'levels' ? n.soundMode : null,
    coughs: num(n.coughs), coughFits: num(n.coughFits), snoreMinDet: num(n.snoreMinDet), otherNoises: num(n.otherNoises),
    soundEvents: Array.isArray(n.soundEvents) ? n.soundEvents.slice(0, 1500).filter(e => Array.isArray(e) && num(e[0]) != null && ['c', 's', 'o'].includes(e[1])).map(e => [e[0], e[1]]) : [],
    depth: Array.isArray(n.depth) ? n.depth.slice(0, 4000).map(v => clamp(num(v) || 0, 0, 1)) : [],
    states: Array.isArray(n.states) ? n.states.slice(0, 4000).map(v => (STATES.has(v) ? v : 'restless')) : [],
    rested: ['1', '2', '3', '4', 1, 2, 3, 4].includes(n.rested) ? String(n.rested) : null,
  };
  if (out.wakeAt == null || out.bedAt == null || out.wakeAt < out.bedAt) return null;
  if (out.inBedMs == null) out.inBedMs = out.wakeAt - out.bedAt;
  return out;
}

const DataIO = {
  async exportBlob() {
    const all = await Store.recent('nights', Infinity);
    const nights = {};
    for (const n of all) { const { id, ...doc } = n; nights[id] = doc; }
    const payload = { format: EXPORT_FORMAT, version: 1, exportedAt: new Date().toISOString(), count: all.length, nights };
    return { blob: new Blob([JSON.stringify(payload, null, 1)], { type: 'application/json' }), count: all.length };
  },
  /* Merge, never overwrite: a night already on this device wins. */
  async importText(text) {
    let data;
    try { data = JSON.parse(text); } catch (_) { throw new Error('That file is not valid JSON.'); }
    if (!data || data.format !== EXPORT_FORMAT || typeof data.nights !== 'object' || !data.nights) {
      throw new Error('That is not a Small Hours export file.');
    }
    let added = 0, kept = 0, bad = 0;
    for (const [id, raw] of Object.entries(data.nights)) {
      const night = NIGHT_ID.test(id) ? cleanNight(raw) : null;
      if (!night) { bad++; continue; }
      if (await Store.get(`nights/${id}`)) { kept++; continue; }
      if (await Store.set(`nights/${id}`, night)) added++; else bad++;
    }
    return { added, kept, bad };
  },
};

App.view_data = function () {
  const msg = this._dataMsg;
  return `<div class="screen on">
    ${this._bar(this._backBtn())}
    <div class="stack" style="gap:14px">
      <h1>Your data stays on this device.</h1>
      <p class="lede">Nights are kept in this browser's storage. Sound is analysed on the phone and nothing is ever uploaded. If, and only if, the clip switch is on, short clips of detected snores, coughs and noises are stored on this phone and deleted automatically after 7 nights. To move your nights to another phone or browser, export a file here and import it there. Clearing this site's data in the browser deletes them — exporting now and then is the backup.</p>
    </div>
    ${msg ? `<div class="panel warm note" role="status" id="dataMsg">${icon('data')}<p style="color:var(--ink-strong)">${esc(msg)}</p></div>` : ''}
    <div class="list">
      <div class="item">${icon('download')}<div class="grow stack" style="gap:10px">
        <h3>Export</h3>
        <p class="caveat">A JSON file with every saved night: times, the score and its parts, the night curve, snore minutes, cough counts and when they happened, and how rested you said you felt. Sound clips are never exported — they stay on this phone.</p>
        <button class="btn quiet wide" id="btnExport">Export nights (${this.history.length ? 'JSON' : 'nothing saved yet'})</button>
      </div></div>
      <div class="item">${icon('upload')}<div class="grow stack" style="gap:10px">
        <h3>Import</h3>
        <p class="caveat">Adds nights from a Small Hours export. A night already on this device is kept as it is.</p>
        <label class="btn quiet wide" for="fileImport" style="cursor:pointer">Choose a file…</label>
        <input type="file" id="fileImport" accept="application/json,.json" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none">
      </div></div>
    </div>

    <div class="panel install stack" style="gap:14px">
      <div class="note" style="align-items:center">${icon('install', 22)}<h2>Install on your phone</h2></div>
      <p class="caveat">It opens full screen, works offline, and is easier to find at bedtime.</p>
      <dl>
        <div><dt>iPhone</dt><dd>In Safari: <span class="k">Share ${icon('share', 17)}</span> → <span class="k">Add to Home Screen</span></dd></div>
        <div><dt>Android</dt><dd>In Chrome: <span class="k">${icon('dots', 17)} menu</span> → <span class="k">Install app</span></dd></div>
      </dl>
    </div>

    <div class="stack" style="gap:10px">
      <h3>Delete</h3>
      <p class="caveat">Removes every night, setting and saved sound clip from this browser. Export first if you want to keep the nights.</p>
      <button class="btn quiet danger wide" id="btnWipe">${icon('trash', 18)}Delete everything</button>
    </div>
    <div class="spacer"></div>
    <button class="btn primary wide" id="btnBack2">Back to tonight</button>
  </div>`;
};
App.after_data = function () {
  const say = m => { this._dataMsg = m; this.render(); };
  this._dataMsg = null;
  el('btnBack').onclick = () => this.go('home');
  el('btnBack2').onclick = () => this.go('home');
  el('btnExport').onclick = async () => {
    const { blob, count } = await DataIO.exportBlob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `small-hours-${dayKey(Date.now())}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    say(`Exported ${count} night${count === 1 ? '' : 's'}.`);
  };
  el('fileImport').onchange = async e => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    try {
      const r = await DataIO.importText(await f.text());
      this.history = await Store.recent('nights', 30);
      this.baseline = Scorer.baseline(this.history);
      say(`Imported ${r.added} night${r.added === 1 ? '' : 's'}.` + (r.kept ? ` ${r.kept} already here, kept as they were.` : '') + (r.bad ? ` ${r.bad} could not be read and were skipped.` : ''));
    } catch (err) { say(err.message || 'Could not read that file.'); }
  };
  let armed = false;
  el('btnWipe').onclick = () => {
    const b = el('btnWipe');
    if (!armed) { armed = true; b.textContent = 'Tap again to delete everything'; setTimeout(() => { armed = false; if (el('btnWipe')) el('btnWipe').innerHTML = `${icon('trash', 18)}Delete everything`; }, 4000); return; }
    for (const k of Store.keys()) { try { localStorage.removeItem(k); } catch (_) {} }
    this.history = []; this.baseline = Scorer.baseline([]);
    this.settings = { alarmTime: '07:00', windowMin: 30, setupDone: false, sensors: null, saveClips: false };
    Clips.wipe().then(() => this.go('setup'), () => this.go('setup'));
  };
};

/* --- offline: cache the app shell (see sw.js). Never needed to work. ----- */
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(e => console.warn('service worker not registered', e));
  });
}

App.boot();
</script>
