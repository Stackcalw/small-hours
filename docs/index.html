<script>
/* ============================================================================
   STAGER — epochs → hypnogram + night metrics

   Honest framing: a phone on a mattress cannot see brain waves. It sees
   movement and sound. So this does NOT claim REM. It produces a continuous
   sleep-depth curve and four states a movement signal can actually support:
   Awake · Restless · Light · Deep.

   Method:
   1. normalise motion against THIS night's own distribution (the absolute
      numbers depend on the mattress, the phone and where it was put)
   2. sleep/wake with a Cole-Kripke-shaped weighted window, night-adaptive
      threshold
   3. Webster rescoring rules to stop brief stillness reading as sleep
   4. a smoothed depth curve, tilted by the time-of-night prior that deep sleep
      front-loads
   ========================================================================== */
const Stager = {
  W: [404, 598, 326, 441, 1408, 508, 350],   // Cole-Kripke shape: -4..+2, centre-heavy
  OFFSET: 4,

  analyze(epochs, startAt, endAt) {
    const n = epochs.length;
    const out = {
      ok: false, reason: null,
      startAt, endAt, inBedMs: Math.max(0, endAt - startAt),
      epochs: n, coverage: 0,
      states: [], depth: [],
      asleepMs: 0, latencyMs: null, wasoMs: 0, awakenings: 0,
      efficiency: 0, deepMs: 0, lightMs: 0, restlessMs: 0, awakeMs: 0,
      deepShare: 0, midSleep: null, onsetAt: null, finalWakeAt: null,
      snoreMinutes: 0, noiseMean: null, hadAudio: false, hadMotion: false,
    };
    if (n < 20) { out.reason = 'The night was too short to read — under ten minutes of data.'; return out; }

    const mRaw = epochs.map(e => (e.m == null ? null : e.m));
    const have = mRaw.filter(v => v != null).length;
    out.coverage = have / n;
    out.hadMotion = have > n * 0.4;

    if (!out.hadMotion) {
      /* No usable motion. The night still has a start, an end and whatever the
         morning check-in adds — the scorer handles that path. */
      /* Unknowable without movement: efficiency, latency, WASO, depth. They go
         null so the scorer drops them rather than awarding free marks. Sleep
         time is an ESTIMATE from time in bed at a typical efficiency. */
      out.reason = 'No movement data — scored from your times only.';
      return this._fromTimes(out);
    }

    /* --- 1. fill short gaps, then normalise against the night itself ------- */
    const m = mRaw.slice(); const invalid = new Array(n).fill(false);
    const MAX_FILL = 6;                     // 3 minutes; past that it is a hole, not a gap
    for (let i = 0; i < n; i++) {
      if (m[i] != null) continue;
      let a = i - 1; while (a >= 0 && mRaw[a] == null) a--;
      let b = i + 1; while (b < n && mRaw[b] == null) b++;
      if (b - a - 1 > MAX_FILL || a < 0 || b >= n) { invalid[i] = true; m[i] = null; continue; }
      m[i] = (mRaw[a] + mRaw[b]) / 2;
    }
    /* A hole is not stillness. Carry the night's median through it so it scores
       as ordinary, and count it against coverage rather than crediting it. */
    const known = m.filter(v => v != null).sort((x, y) => x - y);
    const med = known.length ? known[Math.floor(known.length / 2)] : 0;
    for (let i = 0; i < n; i++) if (m[i] == null) m[i] = med;
    out.gapMinutes = Math.round(invalid.filter(Boolean).length * EPOCH_MS / 60000);
    out.coverage = Math.min(out.coverage, 1 - invalid.filter(Boolean).length / n);
    const sorted = m.slice().sort((x, y) => x - y);
    const q = p => sorted[clamp(Math.round(p * (sorted.length - 1)), 0, sorted.length - 1)];
    const floor = q(0.15), top = Math.max(q(0.95), q(0.15) + 1e-6);
    const span = Math.max(top - floor, 1e-6);
    /* If floor and top are indistinguishable the phone never registered a body. */
    if (top / Math.max(floor, 1e-9) < 1.15 && top < 0.5) {
      /* The sensor ran but nothing reached it: a phone on the nightstand.
         Unreadable — a still phone looks exactly like perfect sleep. */
      this._fromTimes(out);
      out.ok = false;
      out.reason = 'The phone did not pick up any movement. Was it on the bed? No score, because a still phone looks exactly like perfect sleep.';
      return out;
    }
    /* 0 = perfectly still, ~1 = as active as this night got; clipped at 3 so a
       single violent epoch cannot dominate the weighted window. */
    const A = m.map(v => clamp((v - floor) / span, 0, 3));

    /* --- 2. Cole-Kripke-shaped weighted window ---------------------------- */
    const D = new Array(n).fill(0);
    for (let i = 0; i < n; i++) {
      let s = 0;
      for (let k = 0; k < this.W.length; k++) {
        const j = i + k - this.OFFSET;
        s += this.W[k] * (j >= 0 && j < n ? A[j] : A[clamp(j, 0, n - 1)]);
      }
      D[i] = s / 4035;                      // sum of weights → back to ~A scale
    }
    /* Night-adaptive threshold. Wrist-actigraph coefficients assume a count
       scale we do not have, so the cut sits between this night's quiet and
       active modes rather than at a fixed constant. */
    const Ds = D.slice().sort((a, b) => a - b);
    const dq = p => Ds[clamp(Math.round(p * (Ds.length - 1)), 0, Ds.length - 1)];
    const thr = Math.max(dq(0.55) * 1.9, dq(0.30) + 0.28 * (dq(0.92) - dq(0.30)));

    let state = D.map(d => (d >= thr ? 'awake' : 'sleep'));

    /* --- 3. Webster rescoring: stillness right after being awake is not sleep */
    const EP_MIN = 2;                                   // epochs per minute (30s)
    /* Each rule reads a SNAPSHOT and writes to a copy. Reading your own writes
       makes every rescored epoch new wake-context for the next one, and the
       cascade swallows the whole night. */
    const rescore = (wakeMin, sleepMin) => {
      const src = state.slice(), out2 = state.slice();
      let run = 0;
      for (let i = 0; i < n; i++) {
        if (src[i] === 'awake') { run++; continue; }
        if (run >= wakeMin * EP_MIN) {
          for (let k = 0; k < sleepMin * EP_MIN && i + k < n; k++) if (src[i + k] === 'sleep') out2[i + k] = 'awake';
        }
        run = 0;
      }
      state = out2;
    };
    rescore(4, 1); rescore(10, 3); rescore(15, 4);
    /* short sleep islands inside long wake are wake */
    const killIsland = (maxSleepMin, needWakeMin) => {
      const src = state.slice(), out2 = state.slice();
      let i = 0;
      while (i < n) {
        if (src[i] !== 'sleep') { i++; continue; }
        let j = i; while (j < n && src[j] === 'sleep') j++;
        if (j - i <= maxSleepMin * EP_MIN) {
          let before = 0, k = i - 1; while (k >= 0 && src[k] === 'awake') { before++; k--; }
          let after = 0, k2 = j; while (k2 < n && src[k2] === 'awake') { after++; k2++; }
          if (before >= needWakeMin * EP_MIN && after >= needWakeMin * EP_MIN) for (let x = i; x < j; x++) out2[x] = 'awake';
        }
        i = j;
      }
      state = out2;
    };
    killIsland(6, 10); killIsland(10, 20);

    /* --- 4. depth curve: smoothed, inverted activity, tilted by night phase - */
    const smooth = (arr, half) => arr.map((_, i) => {
      let s = 0, w = 0;
      for (let j = -half; j <= half; j++) {
        const k = i + j; if (k < 0 || k >= n) continue;
        const g = Math.exp(-(j * j) / (2 * (half / 2) * (half / 2) || 1));
        s += arr[k] * g; w += g;
      }
      return w ? s / w : arr[i];
    });
    /* A is normalised across the WHOLE night, so wake-vs-sleep uses up all the
       range and every sleeping epoch looks equally still. Depth needs its own
       normalisation, taken from the sleeping epochs only. */
    const sleepVals = [];
    for (let i = 0; i < n; i++) if (state[i] === 'sleep') sleepVals.push(m[i]);
    sleepVals.sort((x, y) => x - y);
    const sq = p => sleepVals[clamp(Math.round(p * (sleepVals.length - 1)), 0, sleepVals.length - 1)];
    const sFloor = sleepVals.length > 20 ? sq(0.06) : floor;
    const sTop = sleepVals.length > 20 ? Math.max(sq(0.94), sFloor + 1e-6) : top;
    const sSpan = Math.max(sTop - sFloor, 1e-6);
    const As = m.map(v => clamp((v - sFloor) / sSpan, 0, 1));
    const quiet = smooth(As.map(v => 1 - v), 9);              // ~4.5 min either side
    const depth = quiet.map((v, i) => {
      if (state[i] === 'awake') return 0;
      /* Deep sleep front-loads: the same stillness early in the night is more
         likely to be deep than the same stillness at 6am. A gentle prior only. */
      const frac = i / Math.max(1, n - 1);
      const prior = 1.15 - 0.35 * frac;
      return clamp(v * prior, 0, 1);
    });

    /* --- states + metrics -------------------------------------------------- */
    const states = state.map((s, i) => {
      if (s === 'awake') return 'awake';
      const d = depth[i];
      /* Three bands, not four, and none of them named after a clinical stage.
         Movement cannot separate REM from N3 (kappa 0.084, Walch 2019), so
         naming them "deep" or "REM" would be inventing precision. */
      if (d >= 0.62) return 'settled';
      return 'restless';
    });

    const tOf = i => (epochs[i] && epochs[i].t) || (startAt + i * EPOCH_MS);
    let onset = -1;
    for (let i = 0; i + 9 < n; i++) {
      let all = true;
      for (let k = 0; k < 10; k++) if (states[i + k] === 'awake') { all = false; break; }
      if (all) { onset = i; break; }
    }
    let finalWake = n - 1;
    for (let i = n - 1; i >= 0; i--) if (states[i] !== 'awake') { finalWake = i; break; }

    let asleep = 0, waso = 0, deepN = 0, lightN = 0, restN = 0, awakeN = 0, bouts = 0, inBout = false;
    for (let i = 0; i < n; i++) {
      const s = states[i];
      if (s === 'awake') {
        awakeN++;
        if (onset >= 0 && i > onset && i < finalWake) { waso++; if (!inBout) { bouts++; inBout = true; } }
      } else {
        inBout = false; asleep++;
        if (s === 'settled') deepN++; else restN++;
      }
    }

    /* Movement bursts prove the phone is mechanically coupled to the bed. A
       decoupled phone produces a beautiful, entirely fictional night — the most
       damaging failure this app has, because it flatters. */
    let bursts = 0, inBurst = false;
    const burstThr = floor + 0.35 * span;
    for (let i = 0; i < n; i++) {
      if (m[i] > burstThr) { if (!inBurst) { bursts++; inBurst = true; } }
      else inBurst = false;
    }
    out.bursts = bursts;
    const hoursIn = out.inBedMs / 3600000;
    /* Deliberately conservative. There is no reliable way to tell "well-coupled
       phone, very still sleeper" from "phone under a pillow", so this only
       refuses the nights where essentially nothing happened at all. The real
       protection is the placement step at bedtime, not this. */
    if (hoursIn >= 4 && bursts < 3) {
      out.ok = false;
      out.reason = 'Almost no movement reached the phone all night. That usually means it was not on the mattress — a nightstand, or under a pillow. No score, because a still phone looks exactly like perfect sleep.';
      return out;
    }

    out.ok = true;
    out.states = states;
    out.depth = depth.map(d => +d.toFixed(3));
    out.onsetAt = onset >= 0 ? tOf(onset) : null;
    out.finalWakeAt = tOf(finalWake);
    out.latencyMs = onset >= 0 ? Math.max(0, tOf(onset) - startAt) : null;
    out.asleepMs = asleep * EPOCH_MS;
    out.wasoMs = waso * EPOCH_MS;
    out.awakenings = bouts;
    out.deepMs = deepN * EPOCH_MS;
    out.lightMs = lightN * EPOCH_MS;
    out.restlessMs = restN * EPOCH_MS;
    out.awakeMs = awakeN * EPOCH_MS;
    out.efficiency = out.inBedMs ? clamp(out.asleepMs / out.inBedMs, 0, 1) : 0;
    out.deepShare = out.asleepMs ? out.deepMs / out.asleepMs : 0;
    out.midSleep = onset >= 0 ? (tOf(onset) + tOf(finalWake)) / 2 : (startAt + endAt) / 2;

    /* --- audio extras: never a stage input, just context ------------------- */
    const ab = epochs.map(e => e.ab).filter(v => v != null);
    const aa = epochs.map(e => e.a).filter(v => v != null);
    if (aa.length > n * 0.4) {
      out.hadAudio = true;
      out.noiseMean = Math.round(aa.reduce((s, v) => s + v, 0) / aa.length);
      const bs = ab.slice().sort((x, y) => x - y);
      const bq = p => bs[clamp(Math.round(p * (bs.length - 1)), 0, bs.length - 1)];
      /* Two conditions, because loud alone means a fan or a road. Snoring is
         loud in the 60-500Hz band AND impulsive: it peaks on each breath and
         drops between them, so peak sits well above the epoch mean. */
      /* Anchor to the night's QUIET decile, not its middle: someone who snores
         most of the night makes snoring the median, and a mid-anchored
         threshold then sits above the very thing it is looking for. The real
         discriminator is the peak-to-mean gap below, which is scale-free. */
      const floorB = bq(0.10);
      const snoreThr = floorB + Math.max(14, 0.35 * (bq(0.95) - floorB));
      let snore = 0;
      for (let i = 0; i < n; i++) {
        const e = epochs[i];
        if (!e || e.ab == null || e.ap == null || e.a == null) continue;
        if (states[i] === 'awake') continue;
        if (e.ab > snoreThr && (e.ap - e.a) > 11) snore++;
      }
      out.snoreMinutes = Math.round(snore * EPOCH_MS / 60000);
    }
    if (out.asleepMs < 45 * 60000) {
      out.reason = 'Under 45 minutes of sleep was detected. Treating this night as unreadable.';
      out.ok = false;
    }
    /* A nap is real sleep but it is not a night, and scoring it would drag the
       personal baseline that judges every actual night. */
    if (out.inBedMs < 180 * 60000) {
      out.reason = `That was ${durShort(out.inBedMs)} in bed — logged as a nap, not scored as a night.`;
      out.ok = false;
    }
    return out;
  },

  /* The sleep-log path, for a device with no motion data at all. Sleep time is
     an ESTIMATE from time in bed at a typical efficiency; the scorer caps it at
     78 and labels it. It counts as a night (ok) when it was long enough to be
     one, so log mode produces the simpler score the setup screen promises. */
  _fromTimes(out) {
    out.estimated = true;
    out.asleepMs = Math.round(out.inBedMs * 0.88);
    out.efficiency = null; out.latencyMs = null; out.wasoMs = null;
    out.awakenings = null; out.deepShare = null; out.deepMs = null;
    out.midSleep = (out.startAt + out.endAt) / 2;
    out.ok = out.inBedMs >= 180 * 60000;
    if (!out.ok) out.reason = `That was ${durShort(out.inBedMs)} in bed — logged as a nap, not scored as a night.`;
    return out;
  },
};
</script>
<script>
/* ============================================================================
   SCORER — night metrics + personal baseline → one number, and why

   Six components, weights summing to 100. Every curve is piecewise-linear and
   printed here so the number is arguable rather than magic.

   The score stays OBJECTIVE — it comes from the sensors. How rested you felt is
   shown NEXT TO it, never blended in, because the gap between the two is the
   most interesting thing the app can show you.
   ========================================================================== */
const Scorer = {
  H: 3600000, M: 60000,

  COMPONENTS: [
    {
      key: 'duration', name: 'How long you slept', weight: 30,
      lever: 'Going to bed 30 minutes earlier is the single biggest lever here.',
      value: (a) => { const v = curve([[0,0],[3,.12],[4.5,.34],[5.5,.55],[6.5,.80],[7,.93],[7.5,1],[9,1],[9.75,.88],[11,.68],[13,.5]], a.asleepMs / 3600000); return a.estimated ? Math.min(v, 0.85) : v; },
      show:  (a) => durShort(a.asleepMs) + (a.estimated ? ' (estimated)' : ''),
    },
    {
      key: 'efficiency', name: 'Time asleep vs time in bed', weight: 18,
      lever: 'Get into bed closer to when you actually fall asleep — lying awake in bed costs you here.',
      value: (a) => a.efficiency == null ? null : curve([[.5,0],[.65,.22],[.75,.48],[.82,.72],[.88,.93],[.92,1],[1,1]], a.efficiency),
      show:  (a) => a.efficiency == null ? '—' : Math.round(a.efficiency * 100) + '%',
    },
    {
      key: 'continuity', name: 'Staying asleep', weight: 17,
      lever: 'Wake-ups this many times usually track with alcohol, a warm room, or a late heavy meal.',
      value: (a) => {
        if (a.wasoMs == null || a.awakenings == null) return null;
        const waso = a.wasoMs / 60000;
        const base = curve([[0,1],[8,.96],[18,.84],[32,.66],[50,.45],[75,.25],[110,.08],[160,0]], waso);
        const pen  = curve([[0,0],[2,0],[4,.06],[7,.15],[12,.28]], a.awakenings);
        return clamp(base - pen, 0, 1);
      },
      show:  (a) => a.awakenings == null ? '—' : a.awakenings === 0 ? 'unbroken' : `${a.awakenings} wake-up${a.awakenings > 1 ? 's' : ''}, ${Math.round(a.wasoMs / 60000)}m`,
    },
    {
      key: 'depth', name: 'How settled the sleep was', weight: 12,
      lever: 'The stillest sleep front-loads the night, so an earlier bedtime buys more of it than a later lie-in does.',
      value: (a) => a.deepShare == null ? null : curve([[0,.08],[.06,.32],[.11,.62],[.16,.90],[.20,1],[.27,1],[.34,.86],[.45,.62],[.6,.4]], a.deepShare),
      show:  (a) => a.deepShare == null ? '—' : Math.round(a.deepShare * 100) + '% of the night still',
    },
    {
      key: 'latency', name: 'Falling asleep', weight: 11,
      lever: 'If it takes over 30 minutes most nights, the fix is usually a later bedtime, not an earlier one. Note this reads movement, so lying still and awake counts as asleep — if it felt longer than this says, trust yourself.',
      value: (a) => a.latencyMs == null ? null
        : curve([[0,.62],[4,.86],[8,1],[18,1],[26,.88],[38,.66],[52,.44],[70,.24],[95,.08]], a.latencyMs / 60000),
      show:  (a) => a.latencyMs == null ? '—' : `${Math.round(a.latencyMs / 60000)} min`,
    },
    {
      key: 'timing', name: 'Same hours as usual', weight: 12,
      lever: 'Your body scores the clock, not just the hours. Keeping the middle of the night steady is worth more than any single long night.',
      value: (a, base) => {
        if (!base || base.nights < 3 || base.midMinutes == null || a.midSleep == null) return null;
        const d = new Date(a.midSleep);
        let mid = d.getHours() * 60 + d.getMinutes();
        let diff = Math.abs(mid - base.midMinutes);
        if (diff > 720) diff = 1440 - diff;            // wrap across midnight
        return curve([[0,1],[20,.96],[40,.84],[65,.66],[95,.45],[130,.26],[180,.08],[240,0]], diff);
      },
      show:  (a, base) => {
        if (!base || base.nights < 3 || a.midSleep == null) return 'learning';
        const d = new Date(a.midSleep);
        let mid = d.getHours() * 60 + d.getMinutes();
        let diff = Math.abs(mid - base.midMinutes); if (diff > 720) diff = 1440 - diff;
        return diff < 15 ? 'right on your usual' : `${Math.round(diff)} min off your usual`;
      },
    },
  ],

  BANDS: [
    [86, 'A strong night',   'This is what your good nights look like.'],
    [72, 'A solid night',    'Good night overall. One small thing below.'],
    [58, 'A patchy night',   'The sleep was there, it just kept breaking.'],
    [44, 'A short night',    'Not a disaster. Tonight is the fix.'],
    [0,  'A hard night',     'These happen. Nothing to make up for — just tonight, as normal.'],
  ],

  compute(a, base) {
    /* Components that cannot be evaluated (no baseline yet, no latency) drop
       out and their weight is redistributed, so night 1 still gets a real
       number instead of a penalty for being night 1. */
    const rows = [];
    let available = 0;
    for (const c of this.COMPONENTS) {
      const v = c.value(a, base);
      if (v == null || !isFinite(v)) { rows.push({ ...c, value: null, points: 0, lost: 0, skipped: true }); continue; }
      rows.push({ ...c, value: clamp(v, 0, 1), skipped: false });
      available += c.weight;
    }
    if (available <= 0) return { total: null, rows, confidence: 0, band: this.BANDS[4] };
    const k = 100 / available;
    let total = 0;
    for (const r of rows) {
      if (r.skipped) continue;
      r.points = r.weight * k * r.value;
      r.lost = r.weight * k * (1 - r.value);
      total += r.points;
    }
    /* Without movement we know only how long you were in bed and when. That
       cannot honestly produce a top score, so it is capped and labelled. */
    if (a.estimated) total = Math.min(total, 78);
    total = Math.round(clamp(total, 0, 100));

    /* Confidence from data completeness — a half-read night must not present a
       confident number. */
    let conf = 1;
    if (!a.hadMotion) conf *= 0.35;
    else conf *= clamp(0.55 + 0.45 * a.coverage, 0, 1);
    if (!a.hadAudio) conf *= 0.92;
    if (a.inBedMs < 4 * this.H) conf *= 0.7;
    if (rows.some(r => r.skipped)) conf *= 0.9;
    conf = clamp(conf, 0.1, 1);

    const band = this.BANDS.find(b => total >= b[0]) || this.BANDS[this.BANDS.length - 1];
    const scored = rows.filter(r => !r.skipped).sort((x, y) => y.lost - x.lost);
    const worst = scored[0] && scored[0].lost >= 4 ? scored[0] : null;
    const best  = scored.slice().sort((x, y) => y.value - x.value)[0];

    return {
      total, rows, confidence: +conf.toFixed(2), band,
      worst, best,
      confLabel: conf >= 0.85 ? 'full read' : conf >= 0.6 ? 'partial read' : 'thin read',
    };
  },

  /* epochs → { night analysis, breakdown, score }. The one path every saved
     night goes through. An unreadable night gets score null — never a number. */
  scoreNight(epochs, startAt, endAt, base) {
    const a = Stager.analyze(epochs, startAt, endAt);
    const res = this.compute(a, base);
    return { a, res, score: a.ok ? res.total : null };
  },

  /* Rolling personal baseline. Timing regularity needs at least three nights,
     so it stays out of the score until then rather than inventing a norm. */
  baseline(nights) {
    const usable = nights.filter(n => n && n.ok && n.asleepMs > 3 * this.H);
    if (!usable.length) return { nights: 0, midMinutes: null, avgAsleepMs: null, avgScore: null };
    let sx = 0, sy = 0;
    for (const n of usable) {
      if (n.midSleep == null) continue;
      const d = new Date(n.midSleep);
      const ang = ((d.getHours() * 60 + d.getMinutes()) / 1440) * Math.PI * 2;
      sx += Math.cos(ang); sy += Math.sin(ang);              // circular mean — 23:50 and 00:10 average to midnight
    }
    let midMinutes = null;
    if (sx || sy) { let ang = Math.atan2(sy, sx); if (ang < 0) ang += Math.PI * 2; midMinutes = Math.round(ang / (Math.PI * 2) * 1440); }
    const withScore = usable.filter(n => typeof n.score === 'number');
    return {
      nights: usable.length,
      midMinutes,
      avgAsleepMs: usable.reduce((s, n) => s + n.asleepMs, 0) / usable.length,
      avgScore: withScore.length ? Math.round(withScore.reduce((s, n) => s + n.score, 0) / withScore.length) : null,
    };
  },
};
</script>
<script>
/* ============================================================================
   CLIPS — short recordings of detected events, only if you switched them on
   IndexedDB 'smallhours-audio', on this phone only, never uploaded and never
   in an export. Each clip is a 16-bit mono 8 kHz WAV, at most 4 s. Per night
   at most 10 coughs, 10 snores and 5 other sounds are kept (the loudest win),
   and clips from all but the last 7 nights are deleted automatically.
   ========================================================================== */
const Clips = {
  DB: 'smallhours-audio', CAP: { cough: 10, snore: 10, other: 5 }, NIGHTS: 7,
  _db: null,
  ok() { return typeof indexedDB !== 'undefined'; },
  open() {
    if (this._db) return Promise.resolve(this._db);
    return new Promise((res, rej) => {
      const r = indexedDB.open(this.DB, 1);
      r.onupgradeneeded = () => { const s = r.result.createObjectStore('clips', { keyPath: 'id', autoIncrement: true }); s.createIndex('night', 'night'); };
      r.onsuccess = () => { this._db = r.result; this._db.onversionchange = () => { try { this._db.close(); } catch (_) {} this._db = null; }; res(this._db); };
      r.onerror = () => rej(r.error);
    });
  },
  async _tx(mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const tx = db.transaction('clips', mode), st = tx.objectStore('clips');
      let out; const r = fn(st); if (r) r.onsuccess = () => { out = r.result; };
      tx.oncomplete = () => res(out); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
    });
  },
  all() { return this._tx('readonly', st => st.getAll()).then(a => a || []); },
  async list(night) { return (await this.all()).filter(c => c.night === night).sort((a, b) => a.t - b.t); },
  remove(id) { return this._tx('readwrite', st => st.delete(id)); },
  async relabel(id, type) {
    const c = await this._tx('readonly', st => st.get(id)); if (!c) return null;
    c.was = c.was || c.type; c.type = type;
    await this._tx('readwrite', st => st.put(c)); return c;
  },
  wav(pcm, sr) {
    const n = pcm.length, b = new ArrayBuffer(44 + n * 2), v = new DataView(b);
    const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    w(36, 'data'); v.setUint32(40, n * 2, true);
    for (let i = 0; i < n; i++) v.setInt16(44 + i * 2, pcm[i], true);
    return b;
  },
  async save({ t, type, peak, dur, night, sr, pcm }) {
    if (!this.ok()) return;
    const kind = type === 'cough' || type === 'snore' ? type : 'other';
    const same = (await this.list(night)).filter(c => c.type === kind);
    if (same.length >= this.CAP[kind]) {
      const quiet = same.sort((a, b) => a.peak - b.peak)[0];
      if (quiet.peak >= peak) return;                        // louder ones already kept
      await this.remove(quiet.id);
    }
    await this._tx('readwrite', st => st.add({ t, type: kind, peak, dur, night, sr, wav: this.wav(pcm, sr), secs: +(pcm.length / sr).toFixed(2) }));
    this.saved = (this.saved || 0) + 1;
  },
  /* keep only the most recent NIGHTS nights' clips */
  async prune() {
    if (!this.ok()) return 0;
    const all = await this.all();
    const nights = [...new Set(all.map(c => c.night))].sort((a, b) => b - a);
    const keep = new Set(nights.slice(0, this.NIGHTS));
    let n = 0; for (const c of all) if (!keep.has(c.night)) { await this.remove(c.id); n++; }
    return n;
  },
  wipe() {
    if (!this.ok()) return Promise.resolve();
    if (this._db) { try { this._db.close(); } catch (_) {} this._db = null; }
    return new Promise(res => { const r = indexedDB.deleteDatabase(this.DB); r.onsuccess = r.onerror = r.onblocked = () => res(); });
  },
};

/* ============================================================================
   PATTERNS — what several nights say that one night cannot
   Pure: a list of saved nights in, plain sentences out. Needs five nights.
   ========================================================================== */
const Patterns = {
  MIN: 5,
  /* clock minutes measured from 18:00, so a 23:30 and a 00:30 bedtime sit an hour apart, not 23 */
  _eve(ts) { const d = new Date(ts); return (d.getHours() * 60 + d.getMinutes() - 1080 + 1440) % 1440; },
  _sd(a) { if (a.length < 2) return 0; const m = a.reduce((s, v) => s + v, 0) / a.length; return Math.sqrt(a.reduce((s, v) => s + (v - m) * (v - m), 0) / (a.length - 1)); },
  _mean(a) { return a.length ? a.reduce((s, v) => s + v, 0) / a.length : null; },
  _clock(eveMin) { const m = Math.round(eveMin + 1080) % 1440; return `${pad2(Math.floor(m / 60))}:${pad2(m % 60)}`; },
  compute(nights) {
    const ns = (nights || []).filter(n => n && n.bedAt && n.wakeAt && n.wakeAt > n.bedAt).sort((a, b) => a.bedAt - b.bedAt);
    if (ns.length < this.MIN) return { enough: false, have: ns.length, need: this.MIN - ns.length };
    const bed = ns.map(n => this._eve(n.bedAt)), wake = ns.map(n => this._eve(n.wakeAt));
    const mid = ns.map(n => this._eve(n.midSleep || (n.bedAt + n.wakeAt) / 2));
    const out = { enough: true, have: ns.length, lines: [] };
    out.sdBed = Math.round(this._sd(bed)); out.sdWake = Math.round(this._sd(wake)); out.sdMid = Math.round(this._sd(mid));
    const steady = v => v <= 30 ? 'steady' : v <= 60 ? 'fairly steady' : 'irregular';
    out.lines.push(`Bedtime varies by about ${out.sdBed} minutes night to night (${steady(out.sdBed)}), usually around ${this._clock(this._mean(bed))}. Wake time varies by ${out.sdWake} minutes, the middle of your sleep by ${out.sdMid}.`);
    /* social jet lag: nights ending on a Saturday or Sunday morning vs the rest */
    const we = [], wd = [];
    ns.forEach((n, i) => { const d = new Date(n.wakeAt).getDay(); (d === 0 || d === 6 ? we : wd).push(mid[i]); });
    if (we.length >= 1 && wd.length >= 2) {
      out.jetLag = Math.round(this._mean(we) - this._mean(wd));
      const a = Math.abs(out.jetLag);
      out.lines.push(a < 20 ? 'Weekends and weekdays run on nearly the same clock — no real social jet lag.'
        : `On weekends the middle of your sleep is ${a} minutes ${out.jetLag > 0 ? 'later' : 'earlier'} than on weekdays. That shift is sometimes called social jet lag; under an hour is common.`);
    } else out.lines.push('Weekday vs weekend needs at least one weekend night and two weekday nights.');
    /* sound trends: first half vs second half of the nights that had sound */
    const snd = ns.filter(n => n.hadAudio || n.soundMode);
    const snoreOf = n => n.snoreMinDet != null ? n.snoreMinDet : (n.snoreMinutes || 0);
    if (snd.length >= 4) {
      const h = Math.floor(snd.length / 2), A = snd.slice(0, h), B = snd.slice(h);
      const sa = this._mean(A.map(snoreOf)), sb = this._mean(B.map(snoreOf));
      out.snoreAvg = Math.round(this._mean(snd.map(snoreOf)));
      const trend = (a, b, unit) => Math.abs(b - a) < Math.max(2, 0.2 * Math.max(a, b)) ? 'roughly flat' : b > a ? `up, from about ${Math.round(a)} to ${Math.round(b)} ${unit}` : `down, from about ${Math.round(a)} to ${Math.round(b)} ${unit}`;
      out.lines.push(`Snoring averages ${out.snoreAvg} minutes a night; recent nights are ${trend(sa, sb, 'minutes')}.`);
      const ev = snd.filter(n => n.coughs != null);
      if (ev.length >= 4) {
        const k = Math.floor(ev.length / 2);
        const ca = this._mean(ev.slice(0, k).map(n => n.coughs)), cb = this._mean(ev.slice(k).map(n => n.coughs));
        out.coughAvg = +this._mean(ev.map(n => n.coughs)).toFixed(1);
        out.lines.push(`Coughs average ${out.coughAvg} a night; recent nights are ${trend(ca, cb, 'a night')}.`);
      }
    } else out.lines.push('Sound trends need at least four nights recorded with the microphone on.');
    /* which hour of the night sounds cluster in */
    const hours = new Array(24).fill(0); let tot = 0;
    for (const n of ns) for (const e of (n.soundEvents || [])) { if (e[1] === 'o') continue; hours[new Date(e[0]).getHours()]++; tot++; }
    if (tot >= 5) {
      const top = hours.indexOf(Math.max(...hours));
      out.peakHour = top;
      out.lines.push(`Coughs and snores cluster between ${pad2(top)}:00 and ${pad2((top + 1) % 24)}:00 — ${Math.round(100 * hours[top] / tot)}% of them, across ${ns.filter(n => (n.soundEvents || []).length).length} nights.`);
    }
    /* score vs bedtime: earlier half of bedtimes vs later half */
    const sc = ns.map((n, i) => ({ s: n.score, b: bed[i] })).filter(x => typeof x.s === 'number');
    if (sc.length >= 4) {
      const sorted = sc.slice().sort((x, y) => x.b - y.b), h = Math.floor(sorted.length / 2);
      const early = this._mean(sorted.slice(0, h).map(x => x.s)), late = this._mean(sorted.slice(sorted.length - h).map(x => x.s));
      out.scoreEarly = Math.round(early); out.scoreLate = Math.round(late);
      const d = Math.round(early - late);
      out.lines.push(Math.abs(d) < 4 ? 'Your score barely changes with bedtime so far.'
        : `Nights you went to bed earlier scored ${Math.abs(d)} points ${d > 0 ? 'higher' : 'lower'} on average (${out.scoreEarly} vs ${out.scoreLate}).`);
    }
    out.gp = 'None of this is a diagnosis. Persistent loud snoring with pauses in breathing, or a cough that keeps going for weeks, is worth mentioning to a GP.';
    return out;
  },
};
</script>
<script>
/* ============================================================================
   HYPNOGRAM — the night, drawn honestly.
   A depth curve, not crisp stage blocks: the signal does not support hard
   boundaries, so the drawing does not pretend to have them. Wake moments are
   marked along the top in dawn amber; depth fills toward indigo.
   ========================================================================== */
function drawHypnogram(canvas, night) {
  const cs = getComputedStyle(document.documentElement);
  const tok = n => cs.getPropertyValue(n).trim();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const W = canvas.clientWidth || 320, H = 168;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.height = H + 'px';
  const g = canvas.getContext('2d');
  g.scale(dpr, dpr);
  g.clearRect(0, 0, W, H);

  const depth = night.depth || [], states = night.states || [];
  const n = depth.length;
  const padL = 4, padR = 4, padT = 20, padB = 22;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  if (!n) {
    g.fillStyle = tok('--dim'); g.font = '13px "IBM Plex Sans", sans-serif'; g.textAlign = 'center';
    g.fillText('no readable signal', W / 2, H / 2);
    return;
  }
  const x = i => padL + (i / Math.max(1, n - 1)) * plotW;
  /* Depth goes DOWN: awake at the top, settled sleep at the bottom, the way a
     hypnogram is always drawn. Drawn the other way up, a deep trough reads as
     a spike of activity — the exact opposite of what it means. */
  const y = d => padT + d * plotH;

  /* the band guides, at the thresholds the stages actually use */
  g.strokeStyle = tok('--line'); g.lineWidth = 1;
  g.font = '11px "IBM Plex Sans", sans-serif'; g.textAlign = 'left';
  [[0.62, 'settled']].forEach(([d, label]) => {
    g.beginPath(); g.moveTo(padL, y(d) + .5); g.lineTo(W - padR, y(d) + .5); g.stroke();
    g.fillStyle = tok('--dim'); g.fillText(label, padL + 3, y(d) - 3);
  });

  /* the depth curve, filled from the wake line down into it */
  const grad = g.createLinearGradient(0, padT, 0, padT + plotH);
  grad.addColorStop(0, tok('--deep-soft'));
  grad.addColorStop(1, tok('--deep'));
  g.beginPath();
  g.moveTo(x(0), padT);
  for (let i = 0; i < n; i++) g.lineTo(x(i), y(depth[i]));
  g.lineTo(x(n - 1), padT); g.closePath();
  g.fillStyle = grad; g.globalAlpha = .6; g.fill(); g.globalAlpha = 1;

  g.beginPath();
  for (let i = 0; i < n; i++) (i ? g.lineTo(x(i), y(depth[i])) : g.moveTo(x(i), y(depth[i])));
  g.strokeStyle = tok('--deep'); g.lineWidth = 1.5; g.lineJoin = 'round'; g.stroke();

  /* wake marks along the top */
  g.fillStyle = tok('--dawn');
  for (let i = 0; i < n; i++) if (states[i] === 'awake') g.fillRect(x(i), 6, Math.max(1.2, plotW / n), 7);

  /* hour ticks */
  /* a saved night stores bedAt/wakeAt; a just-finished one has startAt/endAt */
  const start = night.startAt != null ? night.startAt : night.bedAt, end = night.endAt != null ? night.endAt : night.wakeAt;
  g.fillStyle = tok('--dim'); g.font = '11px "IBM Plex Sans", sans-serif'; g.textAlign = 'center';
  const hours = Math.max(1, Math.round((end - start) / 3600000));
  const step = hours > 9 ? 2 : 1;
  for (let h = 0; h <= hours; h += step) {
    const t = start + h * 3600000; if (t > end) break;
    const px = padL + ((t - start) / Math.max(1, end - start)) * plotW;
    g.fillRect(px, padT + plotH, 1, 4);
    if (px > 12 && px < W - 12) g.fillText(hhmm(t), px, H - 6);
  }
}

/* ============================================================================
   APP — screens and state
   ========================================================================== */
const App = {
  screen: 'boot',
  settings: { alarmTime: '07:00', windowMin: 30, setupDone: false, sensors: null, saveClips: false },
  session: null,          // an in-progress night, checkpointed so a reload resumes it
  night: null,            // the finished night being shown on the morning screen
  history: [],
  baseline: null,
  _loop: null, _checkpoint: 0,

  async boot() {
    await Store.init();
    const s = await Store.get('meta/settings');
    if (s) this.settings = { ...this.settings, ...s };
    this.history = await Store.recent('nights', 30);
    this.baseline = Scorer.baseline(this.history);

    /* resume an interrupted night: the tab reloaded, or the browser dropped it */
    let live = null;
    try { live = JSON.parse(localStorage.getItem(`${APP}:live`) || 'null'); } catch (_) {}
    if (live && live.startAt && Date.now() - live.startAt < 20 * 3600000 && !live.ended) {
      this.session = live;
      this.go('resume');
      return;
    }
    this.go(this.settings.setupDone ? 'home' : 'setup');
  },

  async save() { await Store.set('meta/settings', this.settings); },

  go(screen) { this.screen = screen; this.render(); window.scrollTo(0, 0); },

  /* --- night lifecycle --------------------------------------------------- */
  async startNight() {
    const [h, m] = (this.settings.alarmTime || '07:00').split(':').map(Number);
    const now = new Date();
    const target = new Date(now); target.setHours(h, m, 0, 0);
    if (target.getTime() <= now.getTime() + 60000) target.setDate(target.getDate() + 1);

    /* both start synchronously inside the tap, before the first await */
    const sensing = Signal.prepare(this.settings.sensors);
    await Alarm.unlock();
    await sensing;
    const canBeSmart = Signal.motionOK;
    Alarm.target = target.getTime();
    Alarm.windowMin = canBeSmart ? this.settings.windowMin : 0;
    Alarm.armed = true;

    Signal.saveClips = !!this.settings.saveClips && Clips.ok();
    if (Signal.saveClips) Clips.prune().catch(() => {});
    await Signal.start();
    Signal.onSound = () => this._soundTick();
    this.session = { startAt: Date.now(), target: target.getTime(), windowMin: Alarm.windowMin, epochs: [], ended: false };
    this._persistLive();

    Signal.onEpoch = (e, all) => {
      this.session.epochs = all;
      if (Date.now() - this._checkpoint > 120000) { this._checkpoint = Date.now(); this._persistLive(); }
      if (Alarm.shouldFire(all, Date.now())) this.fireAlarm();
      const el = document.getElementById('nightClock');
      if (el) el.textContent = `${hhmm(this.session.startAt)} — ${dur(Date.now() - this.session.startAt)}`;
    };
    /* independent deadline watchdog: even if no epoch lands, the alarm fires */
    clearInterval(this._loop);
    clearInterval(this._soundLoop);
    this._soundLoop = setInterval(() => this._soundTick(), 1000);
    this._loop = setInterval(() => {
      if (!this.session || this.session.ended) return;
      Alarm.recover();          // backstop: a wake event can be missed overnight
      if (Alarm.shouldFire(Signal.epochs(), Date.now())) this.fireAlarm();
      const el = document.getElementById('nightClock');
      if (el) el.textContent = `${hhmm(this.session.startAt)} — ${dur(Date.now() - this.session.startAt)}`;
    }, 5000);

    document.body.classList.add('tracking');
    this.go('tracking');
  },

  _persistLive() {
    try {
      localStorage.setItem(`${APP}:live`, JSON.stringify({
        startAt: this.session.startAt, target: this.session.target,
        windowMin: this.session.windowMin, ended: this.session.ended,
        epochs: this.session.epochs.slice(-1400),
      }));
    } catch (_) {}
  },

  fireAlarm() { if (this.screen === 'alarm') return; Alarm.fire(); this.go('alarm'); },

  async endNight() {
    Alarm.silence();
    Alarm.armed = false;
    clearInterval(this._loop); this._loop = null;
    clearInterval(this._soundLoop); this._soundLoop = null;
    const epochs = Signal.stop();
    document.body.classList.remove('tracking');
    const startAt = this.session ? this.session.startAt : Date.now() - 3600000;
    const endAt = Date.now();

    const { a, res, score } = Scorer.scoreNight(epochs.length ? epochs : (this.session && this.session.epochs) || [], startAt, endAt, this.baseline);
    const snd = soundSummary(epochs.length ? epochs : (this.session && this.session.epochs) || [], Signal.events);
    const night = {
      ...a, ...snd, score, confidence: res.confidence,
      wakeAt: endAt, bedAt: startAt,
      rested: null,
      rows: res.rows.map(r => ({ key: r.key, name: r.name, value: r.value, points: +(r.points || 0).toFixed(1), skipped: r.skipped })),
    };
    this.night = { ...night, _res: res };
    try { localStorage.removeItem(`${APP}:live`); } catch (_) {}
    this.session = null;

    /* the night document: epochs are dropped, the depth curve is kept */
    await Store.set(`nights/${dayKey(endAt)}`, {
      ok: a.ok, reason: a.reason, score, confidence: res.confidence,
      bedAt: startAt, wakeAt: endAt, inBedMs: a.inBedMs, asleepMs: a.asleepMs,
      latencyMs: a.latencyMs, wasoMs: a.wasoMs, awakenings: a.awakenings, estimated: !!a.estimated,
      efficiency: a.efficiency == null ? null : +a.efficiency.toFixed(3),
      deepMs: a.deepMs, deepShare: a.deepShare == null ? null : +a.deepShare.toFixed(3),
      midSleep: a.midSleep, coverage: +a.coverage.toFixed(2),
      hadMotion: a.hadMotion, hadAudio: a.hadAudio, snoreMinutes: a.snoreMinutes,
      depth: a.depth, states: a.states, rested: null,
      ...snd,
    });
    this.history = await Store.recent('nights', 30);
    this.baseline = Scorer.baseline(this.history);
    this.go('morning');
  },

  async setRested(v) {
    if (!this.night) return;
    this.night.rested = v;
    const key = dayKey(this.night.wakeAt);
    const doc = await Store.get(`nights/${key}`);
    if (doc) await Store.set(`nights/${key}`, { ...doc, rested: v });
    this.render();
  },

  /* the tracking screen's sound line: dim, updated once a second, no motion */
  _soundTick() {
    const bar = document.getElementById('nightSound'), txt = document.getElementById('nightSoundTxt');
    if (!bar || !txt) return;
    if (!Signal.audioOK) { txt.textContent = Signal.audioWhy || 'Microphone off — movement only'; bar.style.transform = 'scaleX(0)'; return; }
    const lv = Signal.frameLevel != null ? Signal.frameLevel : Signal.level;
    const fresh = Date.now() - (Signal._heardAt || 0) < 3000;
    bar.style.transform = `scaleX(${fresh && lv != null ? clamp((lv + 80) / 60, 0.04, 1).toFixed(2) : 0})`;
    const ev = Signal.events || [];
    const c = ev.filter(e => e.type === 'cough').length, k = ev.filter(e => e.type === 'snore').length;
    txt.textContent = !fresh ? 'listening… no sound arriving yet' : Signal._worklet
      ? `hearing the room · ${c} cough${c === 1 ? '' : 's'} · ${k} snore${k === 1 ? '' : 's'}`
      : 'hearing the room (levels only)';
  },

  render() { /* defined below */ },
};

/* Night sound fields, from the per-epoch counts (sc/sk/so, which survive a
   reload) and the event list. soundEvents is [time, 'c'|'s'|'o'], the source
   for the morning timeline and Patterns; other noise is capped first. */
function soundSummary(epochs, events) {
  const hasEv = (epochs || []).some(e => e && e.sc != null);
  if (!hasEv) return { soundMode: (epochs || []).some(e => e && e.a != null) ? 'levels' : null };
  let coughs = 0, snoreEp = 0, other = 0;
  for (const e of epochs) { if (!e || e.sc == null) continue; coughs += e.sc; other += e.so; if (e.sk > 0) snoreEp++; }
  const code = { cough: 'c', snore: 's', other: 'o' };
  let list = (events || []).filter(e => code[e.type]).map(e => [Math.round(e.t), code[e.type]]);
  const main = list.filter(e => e[1] !== 'o').slice(-1200), rest = list.filter(e => e[1] === 'o').slice(-(1500 - main.length));
  list = main.concat(rest).sort((a, b) => a[0] - b[0]);
  const fits = soundFits(list);
  return { soundMode: 'events', coughs, coughFits: fits, snoreMinDet: +(snoreEp * EPOCH_MS / 60000).toFixed(1), otherNoises: other, soundEvents: list };
}
function soundFits(list) {
  let fits = 0, run = 0, last = -1e12;
  for (const [t, k] of list) { if (k !== 'c') continue; if (t - last <= SoundEvents.P.fitGap) { run++; if (run === SoundEvents.P.fitMin) fits++; } else run = 1; last = t; }
  return fits;
}
</script>
<script>
/* ============================================================================
   SCREENS
   Each screen shows one thing and one action. It is operated half asleep in a
   dark room, so targets are large and there is never more than one decision.
   ========================================================================== */
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const el = id => document.getElementById(id);

function bandColor(v) { return v >= .8 ? 'high' : v >= .55 ? '' : v >= .35 ? 'mid' : 'low'; }

/* Icons: one drawn set, 1.6 stroke on a 24 grid, inherit currentColor. */
const ICON_PATHS = {
