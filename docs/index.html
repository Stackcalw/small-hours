<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Small Hours</title>
<meta name="description" content="A sleep tracker for a phone lying on the mattress. Movement and sound in, one honest score out. Everything stays on your device.">
<meta name="theme-color" content="#100D0B">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Small Hours">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/fraunces-opsz.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/ibm-plex-sans-wght.woff2" as="font" type="font/woff2" crossorigin>

<style>
/* ============================================================================
   SMALL HOURS — tokens
   Lamplight. The app is used in a dark bedroom at 2am and again at 7am, so the
   night palette is the default: a warm near-black ground, parchment ink and one
   candle-amber accent, with no blue anywhere near the bedtime screens. Sage
   marks settled sleep. Light is the morning override.

   Palette (Realtime Colors roles, ~60 / 30 / 10):
     text #EDE3D4 · background #100D0B · primary #E9A863
     secondary #25201B (raised surfaces) · accent #9DB5A6 (settled sleep)
   Contrast, WCAG 2.x, against the background unless noted:
     ink 15.25 · ink-strong 16.83 · dim 7.05 (5.88 on surface-2) · amber 9.45
     sage 8.85 · rust 7.22 · button ink on amber 9.00 · control edge 3.19
     tracking screen, on #000: text #9C6B45 4.60, large text/edges #7E5A3C 3.41
   Light (morning): ink 14.85 · dim 5.64 (5.06 on surface-2) · amber 5.51
     sage 5.68 · rust 5.60 · button ink on amber 5.99 · control edge 3.11
   ========================================================================== */
@font-face {
  font-family: "Fraunces";
  src: url("fonts/fraunces-opsz.woff2") format("woff2");
  font-weight: 100 900; font-style: normal; font-display: swap;
}
@font-face {
  font-family: "IBM Plex Sans";
  src: url("fonts/ibm-plex-sans-wght.woff2") format("woff2");
  font-weight: 100 700; font-style: normal; font-display: swap;
}

:root {
  --bg:          #100D0B;   /* warm near-black: no blue light at bedtime */
  --bg-deep:     #000000;   /* tracking screen only — emits nothing on OLED */
  --surface:     #1A1613;
  --surface-2:   #25201B;
  --ink:         #EDE3D4;   /* parchment, never pure white */
  --ink-strong:  #F6EEE2;
  --dim:         #A89A89;
  --line:        #2E2721;   /* quiet dividers, decorative only */
  --edge:        #6E6052;   /* control boundaries, 3:1 */

  --dawn:        #E9A863;   /* candle amber — the one accent */
  --dawn-soft:   #3A2A1A;
  --dawn-ink:    #1C1206;
  --deep:        #9DB5A6;   /* sage — settled sleep */
  --deep-soft:   #1F2622;

  --good:        #9DB5A6;
  --warn:        #E9A863;
  --bad:         #E58467;

  --night-ink:   #9C6B45;   /* tracking text: 4.6:1 on black and no brighter */
  --night-low:   #7E5A3C;   /* tracking large text and edges: 3.4:1 */

  --display:     "Fraunces", Georgia, "Times New Roman", serif;
  --body:        "IBM Plex Sans", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono:        var(--body);

  --spring:      linear(0, 0.083, 0.269, 0.487, 0.69, 0.853, 0.969, 1.04, 1.075, 1.083, 1.076, 1.06, 1.042, 1.025, 1.011, 1.002, 0.996, 0.994, 0.993, 0.994, 0.995, 0.997, 0.998, 0.999, 1);
  --settle:      linear(0, 0.059, 0.191, 0.349, 0.505, 0.643, 0.756, 0.843, 0.908, 0.953, 0.982, 1, 1.01, 1.014, 1.015, 1.012, 1.007, 1.003, 1.001, 1);

  --r:           16px;
  --pad:         20px;
  color-scheme:  dark;
}

/* Light — a 7am wake-up on a phone set to light mode. Unbleached paper. */
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg:        #F4EFE7;
    --surface:   #FBF8F3;
    --surface-2: #EAE3D8;
    --ink:       #221B15;
    --ink-strong:#120E0A;
    --dim:       #6A5C4E;
    --line:      #E2D9CC;
    --edge:      #94857A;
    --dawn:      #8C520F;
    --dawn-soft: #F3E2CC;
    --dawn-ink:  #FFF8EF;
    --deep:      #3F6650;
    --deep-soft: #DCE6DF;
    --good:      #3F6650;
    --warn:      #8C520F;
    --bad:       #A23F27;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg:        #F4EFE7;
  --surface:   #FBF8F3;
  --surface-2: #EAE3D8;
  --ink:       #221B15;
  --ink-strong:#120E0A;
  --dim:       #6A5C4E;
  --line:      #E2D9CC;
  --edge:      #94857A;
  --dawn:      #8C520F;
  --dawn-soft: #F3E2CC;
  --dawn-ink:  #FFF8EF;
  --deep:      #3F6650;
  --deep-soft: #DCE6DF;
  --good:      #3F6650;
  --warn:      #8C520F;
  --bad:       #A23F27;
  color-scheme: light;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; height: 100%; background: var(--bg); }
body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.5;
  overscroll-behavior: none;
  overflow-x: hidden;
  font-variant-numeric: tabular-nums;
  caret-color: var(--dawn);
}
::selection { background: var(--dawn); color: var(--dawn-ink); }
svg { flex: none; }

/* --- app shell ----------------------------------------------------------- */
#app {
  max-width: 520px;
  margin: 0 auto;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  padding: max(env(safe-area-inset-top), 16px) var(--pad) max(env(safe-area-inset-bottom), 20px);
}
.screen { display: none; flex-direction: column; gap: 24px; flex: 1; min-width: 0; }
.screen.on { display: flex; }

/* --- type ---------------------------------------------------------------- */
h1, h2, h3 { margin: 0; font-family: var(--display); font-weight: 400; text-wrap: balance; color: var(--ink-strong); }
h1 { font-size: 32px; line-height: 1.08; letter-spacing: -.02em; font-optical-sizing: auto; }
h2 { font-size: 22px; line-height: 1.15; letter-spacing: -.01em; }
h3 { font-size: 17px; font-family: var(--body); font-weight: 600; line-height: 1.3; }
p  { margin: 0; }
strong { font-weight: 600; color: var(--ink-strong); }
.lede { color: var(--dim); font-size: 16px; line-height: 1.55; max-width: 44ch; text-wrap: pretty; }
.label { font-size: 13px; font-weight: 500; color: var(--dim); }
.num { font-variant-numeric: tabular-nums; }
.caveat { font-size: 14px; color: var(--dim); line-height: 1.5; max-width: 52ch; text-wrap: pretty; }

/* --- top bar ------------------------------------------------------------- */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; }
.mark { display: inline-flex; align-items: center; gap: 10px; font-family: var(--display); font-size: 19px; color: var(--ink-strong); letter-spacing: -.01em; }
.mark svg { color: var(--dawn); }
.bar-actions { display: flex; gap: 4px; }
.iconbtn {
  display: inline-flex; align-items: center; gap: 8px;
  min-height: 44px; min-width: 44px; padding: 0 12px; justify-content: center;
  border-radius: 999px; color: var(--ink); font-size: 15px; font-weight: 500;
}
.iconbtn:hover { background: var(--surface); }

/* --- controls ------------------------------------------------------------ */
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
.btn {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 56px; padding: 14px 20px;
  border-radius: 999px;
  background: var(--surface-2); color: var(--ink-strong);
  border: 1px solid transparent;
  font-weight: 500; font-size: 16px; line-height: 1.2; text-align: center;
  touch-action: manipulation; user-select: none; -webkit-user-select: none;
}
.btn:hover { background: color-mix(in srgb, var(--surface-2) 86%, var(--ink)); }
.btn.primary { background: var(--dawn); color: var(--dawn-ink); font-weight: 600; }
.btn.primary:hover { background: color-mix(in srgb, var(--dawn) 90%, var(--ink-strong)); }
.btn.quiet   { background: none; border-color: var(--edge); color: var(--ink); min-height: 48px; font-size: 15px; }
.btn.quiet:hover { background: var(--surface); }
.btn.wide    { width: 100%; }
.btn.huge    { min-height: 88px; font-size: 20px; letter-spacing: -.005em; }
.btn.danger  { border-color: color-mix(in srgb, var(--bad) 70%, transparent); color: var(--bad); }
:focus-visible { outline: 2px solid var(--dawn); outline-offset: 3px; }
.btn:focus-visible, .iconbtn:focus-visible, .pill:focus-visible { border-radius: 999px; }

.row { display: flex; gap: 10px; }
.row > * { flex: 1; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.spacer { flex: 1; min-height: 8px; }

/* --- surfaces: spent by role, a tone step, never a frame on everything ---- */
.panel { background: var(--surface); border-radius: var(--r); padding: 20px; }
.panel.warm { background: var(--dawn-soft); }
.list { background: var(--surface); border-radius: var(--r); }
.list > * + * { border-top: 1px solid var(--line); }
.item { display: flex; gap: 14px; align-items: flex-start; padding: 16px 18px; }
.item > svg { margin-top: 2px; color: var(--dim); }
.item .grow { flex: 1; min-width: 0; }

/* --- setup: the sensor check ------------------------------------------- */
.sense { display: grid; grid-template-columns: 22px 1fr auto; gap: 4px 14px; align-items: center; padding: 16px 18px; }
.sense > svg { color: var(--dim); }
.sense .why { grid-column: 2 / -1; font-size: 14px; color: var(--dim); line-height: 1.45; }
.state { display: inline-flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 500; color: var(--dim); white-space: nowrap; }
.state::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; opacity: .9; }
.state.ok { color: var(--good); }
.state.off { color: var(--bad); }
.state.idle::before { background: none; box-shadow: inset 0 0 0 1.5px currentColor; }

/* --- home: the bedtime block -------------------------------------------- */
.lastnight { display: flex; align-items: center; justify-content: space-between; gap: 14px; width: 100%; text-align: left; padding: 14px 16px 14px 18px; border-radius: var(--r); background: var(--surface); }
.lastnight .big { font-family: var(--display); font-size: 34px; line-height: 1; color: var(--dawn); letter-spacing: -.02em; }
.lastnight .meta { font-size: 14px; color: var(--dim); }
.lastnight .go { display: inline-flex; align-items: center; gap: 4px; font-size: 15px; font-weight: 500; color: var(--ink); }
.wake { display: flex; flex-direction: column; gap: 6px; }
.wake input[type="time"] {
  width: 100%; min-width: 0; appearance: none; -webkit-appearance: none;
  background: var(--surface); border: 1px solid transparent; color: var(--ink-strong);
  font-family: var(--display); font-weight: 300; font-size: 64px; line-height: 1.1; letter-spacing: -.03em;
  padding: 10px 16px; border-radius: var(--r); text-align: center; font-variant-numeric: tabular-nums;
  min-height: 104px; display: block;
}
.wake input[type="time"]::-webkit-date-and-time-value { text-align: center; }
.wake input[type="time"]::-webkit-calendar-picker-indicator { width: 22px; height: 22px; padding: 0; margin-left: 8px; filter: invert(.6) sepia(1); opacity: .5; }
.wake input[type="time"]:hover { border-color: var(--edge); }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 4px; background: var(--surface); border-radius: 999px; }
.seg button { min-height: 48px; border-radius: 999px; font-size: 15px; font-weight: 500; color: var(--dim); }
.seg button[aria-checked="true"] { background: var(--surface-2); color: var(--ink-strong); box-shadow: inset 0 0 0 1px var(--edge); }
.seg-note { font-size: 14px; color: var(--dim); }
.safety { display: flex; flex-direction: column; gap: 2px; }
.safety p { display: flex; gap: 10px; align-items: flex-start; font-size: 14.5px; line-height: 1.45; color: var(--ink); padding: 6px 0; }
.safety svg { margin-top: 2px; color: var(--dawn); }
.safety .must { color: var(--ink-strong); }
.checklist { margin: 0; padding: 0 0 0 20px; font-size: 15px; line-height: 1.55; color: var(--ink); display: grid; gap: 8px; }
.checklist li::marker { color: var(--dim); }
.linkish { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 2px; font-size: 15px; font-weight: 500; color: var(--ink); text-decoration: underline; text-decoration-color: var(--edge); text-underline-offset: 4px; }

/* --- the score ----------------------------------------------------------- */
.score-wrap { display: flex; align-items: flex-end; gap: 16px; }
.score {
  font-family: var(--display);
  font-weight: 300;
  font-size: clamp(128px, 46vw, 196px);
  line-height: .78;
  letter-spacing: -.045em;
  color: var(--dawn);
  font-variant-numeric: tabular-nums;
  display: inline-block;
  transform-origin: 0 100%;
}
.score-of { font-size: 15px; line-height: 1.35; color: var(--dim); padding-bottom: 6px; }
.score-of b { display: block; font-weight: 500; color: var(--ink); }
.verdict { font-family: var(--display); font-size: 28px; line-height: 1.1; letter-spacing: -.015em; color: var(--ink-strong); }
.cost { display: flex; gap: 12px; align-items: flex-start; padding: 18px 18px 18px 16px; border-radius: var(--r); background: var(--dawn-soft); }
.cost > svg { color: var(--dawn); margin-top: 2px; }
.cost h2 { font-size: 21px; }
.cost .pts { color: var(--dawn); white-space: nowrap; }
.confpill { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 500; color: var(--dim); }
.confpill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.confpill.ok { color: var(--good); } .confpill.warn { color: var(--warn); } .confpill.off { color: var(--bad); }

/* component bars */
.comp { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: baseline; }
.comp + .comp { margin-top: 18px; }
.comp-name { font-size: 15px; color: var(--ink); }
.comp-val  { font-size: 14px; color: var(--dim); font-variant-numeric: tabular-nums; text-align: right; }
.comp-track { grid-column: 1 / -1; display: block; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.comp-fill  { display: block; height: 100%; border-radius: 3px; background: var(--dawn); transform-origin: 0 50%; }
.comp-fill.low { background: var(--bad); }
.comp-fill.mid { background: var(--warn); }
.comp-fill.high{ background: var(--good); }

/* --- hypnogram ----------------------------------------------------------- */
.hypno { width: 100%; display: block; border-radius: 12px; background: var(--surface); }
.hypno-legend { display: flex; gap: 6px 14px; flex-wrap: wrap; font-size: 13px; color: var(--dim); }
.hypno-legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
.hypno-legend .total { margin-left: auto; color: var(--ink); }

/* rested */
.rested { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.rested .btn { min-height: 60px; padding: 10px 4px; font-size: 15px; border-radius: 14px; }
.rested .btn:not(.primary) { background: var(--surface-2); }

/* --- history ------------------------------------------------------------- */
.chart { position: relative; display: flex; gap: 5px; align-items: flex-end; padding-top: 22px; }
.chart .col { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.chart .bw { height: 100px; width: 100%; display: flex; align-items: flex-end; justify-content: center; }
.chart .b { width: 100%; max-width: 22px; border-radius: 4px 4px 2px 2px; }
.chart .d { font-size: 11px; height: 11px; color: var(--dim); line-height: 1; }
.chart .avg { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--edge); pointer-events: none; }
.chart .avg span { position: absolute; right: 0; top: -20px; font-size: 12px; color: var(--dim); background: var(--surface); padding: 0 0 0 6px; }
.key { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--dim); margin-top: 14px; }
.key i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
.night-row { display: grid; grid-template-columns: 1fr auto 18px; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 14px 14px 14px 18px; min-height: 68px; }
.night-row:hover { background: color-mix(in srgb, var(--surface) 70%, var(--surface-2)); }
.night-row:first-child { border-radius: var(--r) var(--r) 0 0; }
.night-row:last-child { border-radius: 0 0 var(--r) var(--r); }
.night-row .day { font-size: 16px; font-weight: 500; color: var(--ink-strong); }
.night-row .sub { font-size: 14px; color: var(--dim); }
.night-row .s { font-family: var(--display); font-size: 32px; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.night-row > svg { color: var(--dim); }

/* --- tracking screen: the darkest thing we can draw ---------------------- */
body.tracking, body.tracking #app { background: var(--bg-deep); }
#s-tracking { background: var(--bg-deep); color: var(--night-ink); text-align: center; justify-content: center; gap: 0; }
#s-tracking .night-top { padding-top: 22vh; display: flex; flex-direction: column; align-items: center; gap: 18px; }
.night-mark { width: 6px; height: 6px; border-radius: 50%; background: var(--night-low); opacity: .5; }
.night-clock { font-family: var(--display); font-weight: 300; font-size: 30px; line-height: 1.1; color: var(--night-low); letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.night-line { font-size: 15px; color: var(--night-ink); line-height: 1.5; }
.night-small { font-size: 13px; color: var(--night-ink); }
#s-tracking .btn { background: none; border: 1px solid var(--night-low); color: var(--night-ink); min-height: 64px; font-weight: 500; }

/* sound: the home check, the tracking line, the morning panel */
.meter { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.meter > i { display: block; height: 100%; width: 100%; background: var(--dawn); opacity: .7; transform-origin: 0 50%; transform: scaleX(0); }
.soundcheck { display: flex; flex-direction: column; gap: 10px; }
.soundcheck .row2 { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.soundcheck .why { font-size: 14px; color: var(--dim); line-height: 1.45; }
.toggle { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 14px 16px; border-radius: var(--r); background: var(--surface); min-height: 64px; }
.toggle .t { font-size: 15px; color: var(--ink); line-height: 1.4; }
.toggle .sw { width: 48px; height: 28px; border-radius: 999px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--edge); position: relative; flex: none; }
.toggle .sw::after { content: ""; position: absolute; top: 4px; left: 4px; width: 20px; height: 20px; border-radius: 50%; background: var(--dim); }
.toggle[aria-checked="true"] .sw { background: var(--dawn-soft); box-shadow: inset 0 0 0 1px var(--dawn); }
.toggle[aria-checked="true"] .sw::after { left: 24px; background: var(--dawn); }
.night-sound { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-top: 10px; }
.night-sound .nbar { width: 64px; height: 2px; border-radius: 1px; background: #1A120C; overflow: hidden; }
.night-sound .nbar > i { display: block; height: 100%; width: 100%; background: var(--night-low); opacity: .6; transform-origin: 0 50%; transform: scaleX(0); }
.stat3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat3 > div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat3 .v { font-family: var(--display); font-size: 30px; line-height: 1.05; color: var(--ink-strong); }
.stat3 .k { font-size: 13px; color: var(--dim); }
.sndline { width: 100%; display: block; }
.clips { display: flex; flex-direction: column; }
.clip { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 4px 6px; align-items: center; padding: 10px 0; }
.clip .when { white-space: nowrap; }
.clip + .clip { border-top: 1px solid var(--line); }
.clip .when { font-size: 15px; color: var(--ink); }
.clip .what { font-size: 13px; color: var(--dim); }
.clip .acts { display: flex; gap: 2px; }
.clip .iconbtn { padding: 0 8px; font-size: 13px; color: var(--dim); min-width: 44px; }
.clip .play { color: var(--dawn); }
.patterns p + p { margin-top: 10px; }

/* --- alarm: hold to get up ---------------------------------------------- */
.alarm-time { font-family: var(--display); font-weight: 300; font-size: 88px; line-height: .9; letter-spacing: -.04em; color: var(--dawn); }
.hold { position: relative; overflow: hidden; isolation: isolate; min-height: 112px !important; font-size: 21px !important; }
.hold .fill { position: absolute; inset: 0; background: var(--ink-strong); opacity: .28; transform: scaleX(0); transform-origin: 0 50%; z-index: -1; }
.hold.holding .fill { transform: scaleX(1); }
.hold-hint { font-size: 14px; color: var(--dim); text-align: center; min-height: 21px; }
#holdLabel { display: inline-flex; align-items: center; gap: 10px; }

/* --- misc ---------------------------------------------------------------- */
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  min-height: 36px; padding: 6px 14px; border-radius: 999px;
  font-size: 14px; font-weight: 500;
  background: var(--surface-2); color: var(--ink);
}
.note { display: flex; gap: 12px; align-items: flex-start; }
.note > svg { color: var(--dawn); margin-top: 2px; }
.install dl { margin: 0; display: grid; gap: 12px; }
.install dt { font-size: 14px; font-weight: 600; color: var(--ink-strong); }
.install dd { margin: 2px 0 0; font-size: 14.5px; color: var(--ink); line-height: 1.5; }
.install .k { display: inline-flex; align-items: center; gap: 4px; font-weight: 500; white-space: nowrap; }
.install .k svg { color: var(--dim); vertical-align: -3px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.scroll-x { overflow-x: auto; }
hr.hair { height: 1px; background: var(--line); border: 0; margin: 0; }

/* ============================================================================
   MOTION — all of it is here, and only for people who have not asked for less.
   Spring curves are CSS linear() (see --spring / --settle); transform and
   opacity only. One hero moment: the score reveal. Nothing moves on the
   tracking screen except a very slow, very dim breathing dot.
   ========================================================================== */
@media (prefers-reduced-motion: no-preference) {
  .btn, .iconbtn, .seg button, .night-row, .lastnight { transition: transform .5s var(--settle), background-color .2s ease, color .2s ease; }
  .btn:active, .lastnight:active, .night-row:active { transform: scale(.97); transition-duration: .08s; }
  .seg button:active { transform: scale(.94); transition-duration: .08s; }
  #s-tracking .btn, #s-tracking .btn:active { transition: none; transform: none; }

  .night-mark { animation: still-listening 12s ease-in-out infinite; }
  .night-sound .nbar > i, .meter > i { transition: transform .9s ease-out; }
  @keyframes still-listening { 0%, 100% { opacity: .18; } 50% { opacity: .55; } }

  .hold .fill { transition: transform .35s var(--settle); }
  .hold.holding .fill { transition: transform 2s linear; }

  .reveal .score { animation: score-in 1.1s var(--spring) .12s both; }
  .reveal .score-of, .reveal .verdict-block { animation: lift-in .9s var(--settle) .55s both; }
  .reveal .cost { animation: lift-in .9s var(--settle) .75s both; }
  .reveal .comp-fill { animation: bar-in 1s var(--spring) both; animation-delay: calc(.95s + var(--i, 0) * 70ms); }
  @keyframes score-in { from { opacity: 0; transform: translateY(18px) scale(.86); } to { opacity: 1; transform: none; } }
  @keyframes lift-in  { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes bar-in   { from { transform: scaleX(0); } to { transform: scaleX(1); } }

  .screen.enter { animation: screen-in .45s var(--settle) both; }
  @keyframes screen-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
}
</style>
</head>
<body>

<div id="app">
  <!-- screens are injected by render() -->
</div>

<script>
/* ============================================================================
   SMALL HOURS
   A sleep tracker for a phone lying on a mattress. Motion + sound in, a
   hypnogram and one honest number out.

   Engine modules below are deliberately pure and framework-free; the native
   iOS build (ios/) is a line-for-line port of them:
     Signal  — raw sensor stream  → per-epoch counts
     Stager  — epochs             → hypnogram + night metrics
     Scorer  — metrics + baseline → 0-100 score with components
     Alarm   — wake window + Web Audio synthesis
   ========================================================================== */

const APP = 'smallhours';
const EPOCH_MS = 30000;          // 30s epochs — the actigraphy standard

/* --- storage -------------------------------------------------------------
   localStorage only, on this device, under keys prefixed "smallhours:".
   Nothing is ever sent anywhere. Export/Import (the "Your data" screen) is the
   way to move nights between devices. */
const Store = {
  _lk(path) { return `${APP}:${path}`; },
  async init() { return 'local'; },
  async get(path) {
    try { const v = localStorage.getItem(this._lk(path)); return v ? JSON.parse(v) : null; }
    catch (_) { return null; }
  },
  async set(path, data) {
    try { localStorage.setItem(this._lk(path), JSON.stringify(data)); return true; }
    catch (e) { console.warn('could not save', path, e); return false; }
  },
  async remove(path) { try { localStorage.removeItem(this._lk(path)); } catch (_) {} },
  async recent(col, n) {
    const out = [];
    try {
      const pre = `${APP}:${col}/`;
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith(pre)) {
          try { out.push({ id: k.slice(pre.length), ...JSON.parse(localStorage.getItem(k)) }); } catch (_) {}
        }
      }
    } catch (_) {}
    return out.sort((a, b) => (b.wakeAt || 0) - (a.wakeAt || 0)).slice(0, n);
  },
  /* every key this app owns — used by "Delete everything" */
  keys() {
    const ks = [];
    try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(`${APP}:`)) ks.push(k); } } catch (_) {}
    return ks;
  },
};

/* --- time helpers --------------------------------------------------------- */
const pad2 = n => String(n).padStart(2, '0');
const hhmm = ts => { const d = new Date(ts); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
const dur  = ms => { const m = Math.max(0, Math.round(ms / 60000)); return `${Math.floor(m / 60)}h ${pad2(m % 60)}m`; };
const durShort = ms => { const m = Math.max(0, Math.round(ms / 60000)); const h = Math.floor(m / 60); return h ? `${h}h ${m % 60}m` : `${m}m`; };
/* A night belongs to the date you WOKE on. Waking at 03:30 still belongs to
   that morning, so no rollover trickery is needed beyond using the wake time. */
const dayKey = ts => { const d = new Date(ts); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp  = (a, b, t) => a + (b - a) * t;
/* piecewise-linear scoring curve: pts = [[x, y], ...] ascending in x, y in 0..1 */
function curve(pts, x) {
  if (x <= pts[0][0]) return pts[0][1];
  for (let i = 1; i < pts.length; i++) {
    if (x <= pts[i][0]) {
      const [x0, y0] = pts[i - 1], [x1, y1] = pts[i];
      return x1 === x0 ? y1 : lerp(y0, y1, (x - x0) / (x1 - x0));
    }
  }
  return pts[pts.length - 1][1];
}

</script>
<script>
/* ============================================================================
   SIGNAL — raw sensors → per-epoch counts
   The phone lies on the mattress. Body movement reaches it as vibration through
   the mattress, so what we measure is bed motion, not wrist motion. We never
   keep a raw sample: motion collapses to one count per 30s epoch, and audio
   collapses to dB aggregates and counts of coughs and snores. The only audio
   ever kept is a ~3 s ring in memory, and short clips of detected events in
   IndexedDB if — and only if — the clip toggle is on. Nothing is uploaded.
   ========================================================================== */
const Signal = {
  motionOK: false, audioOK: false, wakeOK: false,
  _epochs: [], _cur: null, _t0: 0,
  _accBuf: [], _lastMag: null, _hp: 0,
  _ac: null, _analyser: null, _stream: null, _freq: null, _time: null,
  _worklet: null, _det: null, _ring: [], _premic: null,
  saveClips: false, events: [], frames: 0, level: null, frameLevel: null, _heardAt: 0,
  audioWhy: '', workletWhy: '', onSound: null,
  _rafId: null, _tickId: null, _wakeLock: null,
  onEpoch: null,

  /* --- capability probing: run this from a tap, it is the setup screen ---- */
  async probeMotion() {
    if (typeof DeviceMotionEvent === 'undefined') return { ok: false, why: 'This browser has no motion sensor API.' };
    try {
      if (typeof DeviceMotionEvent.requestPermission === 'function') {
        const res = await DeviceMotionEvent.requestPermission();
        if (res !== 'granted') return { ok: false, why: 'Motion access was not granted. Either it was declined, or this device has no motion sensor (most laptops and desktops do not).' };
      }
    } catch (e) {
      /* iOS throws here when the request does not come straight from a tap, or
         when the page is not served over HTTPS. */
      return { ok: false, why: window.isSecureContext ? 'Motion access could not be requested. Tap "Check again" to retry.' : 'Motion needs the page served over HTTPS.' };
    }
    /* Permission is not proof of delivery — a device with no accelerometer (most
       laptops), or a browser that blocks it, never fires a single event. Listen for real. */
    const got = await new Promise(resolve => {
      let n = 0;
      const h = ev => { if (ev && (ev.accelerationIncludingGravity || ev.acceleration)) n++; };
      window.addEventListener('devicemotion', h);
      setTimeout(() => { window.removeEventListener('devicemotion', h); resolve(n); }, 1200);
    });
    if (got < 3) return { ok: false, why: 'No movement readings arrived. Most laptops and desktops have no motion sensor; on a phone, open this page in the browser itself over HTTPS.' };
    this.motionOK = true;
    return { ok: true, rate: Math.round(got / 1.2) };
  },

  async probeAudio() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return { ok: false, why: 'No microphone API here.' };
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
      });
      stream.getTracks().forEach(t => t.stop());
      this.audioOK = true;
      return { ok: true };
    } catch (e) {
      return { ok: false, why: e && e.name === 'NotAllowedError' ? 'Microphone access was declined.' : 'The microphone could not be opened' + (window.isSecureContext ? '.' : ' — it needs the page served over HTTPS.') };
    }
  },

  async probeWakeLock() {
    if (!('wakeLock' in navigator)) return { ok: false, why: 'This browser cannot keep the screen awake. Set Auto-Lock to Never instead.' };
    try {
      const wl = await navigator.wakeLock.request('screen');
      await wl.release();
      this.wakeOK = true;
      return { ok: true };
    } catch (e) { return { ok: false, why: 'Screen wake lock was refused. Set Auto-Lock to Never instead.' }; }
  },

  /* --- bedtime: re-arm sensors from the "Start the night" tap ----------------
     The motion check result is remembered in settings, but the permission is not:
     iOS Safari wants DeviceMotionEvent.requestPermission() again on every page
     load, and it only answers when called straight from a tap. Call this FIRST
     in the tap handler, before anything else awaits. Once granted it resolves
     at once, with no second prompt. */
  prepare(sensors) {
    const s = sensors || {};
    /* Always try the microphone at bedtime, whatever the first-run check said:
       a declined or failed check must not silently switch sound off for good.
       getUserMedia is called here, inside the tap, which is what iOS wants; a
       failure is shown on the tracking screen. */
    this.audioOK = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
    this._premic = null;
    if (this.audioOK) { try { this._premic = this._openMic(this._plainPref); this._premic.catch(() => {}); } catch (_) { this._premic = null; } }
    this.motionOK = false;
    if (!(s.motion && s.motion.ok) || typeof DeviceMotionEvent === 'undefined') return Promise.resolve(false);
    if (typeof DeviceMotionEvent.requestPermission !== 'function') { this.motionOK = true; return Promise.resolve(true); }
    let p;
    try { p = DeviceMotionEvent.requestPermission(); } catch (_) { return Promise.resolve(false); }
    return Promise.resolve(p).then(r => (this.motionOK = r === 'granted'), () => false);
  },

  /* --- wake lock, re-acquired every time the tab comes back -------------- */
  async _holdWake() {
    if (!('wakeLock' in navigator)) return;
    try { this._wakeLock = await navigator.wakeLock.request('screen'); }
    catch (_) { this._wakeLock = null; }
  },
  _wakeHandler() { if (document.visibilityState === 'visible') Signal._holdWake(); },

  /* --- motion --------------------------------------------------------------
     Per sample: magnitude of the acceleration vector, high-pass filtered to
     strip gravity, rectified. Per epoch: the sum of that (an area-under-curve
     activity count, the mode research actigraphs use) plus the peak. */
  _onMotion(ev) {
    const a = ev.accelerationIncludingGravity || ev.acceleration;
    if (!a || a.x == null) return;
    const mag = Math.sqrt(a.x * a.x + a.y * a.y + a.z * a.z);
    if (this._lastMag === null) { this._lastMag = mag; return; }
    /* one-pole high pass: removes the 1g constant and any slow tilt drift */
    this._hp = 0.92 * (this._hp + mag - this._lastMag);
    this._lastMag = mag;
    const v = Math.abs(this._hp);
    if (!this._cur) return;
    this._cur.mSum += v;
    this._cur.mPeak = Math.max(this._cur.mPeak, v);
    this._cur.mN++;
  },

  /* --- audio ---------------------------------------------------------------
     Two paths off the same microphone:
     1. the analyser, read every 250 ms, collapses to the per-epoch a/ap/ab
        numbers the night scorer has always used (unchanged maths);
     2. the sound worklet (sound-worklet.js), where the browser has
        AudioWorklet: 50 ms frames for the cough/snore detector, plus an 8 kHz
        copy that lives only in a ~3 s ring in memory, and is written out as a
        clip ONLY when the clip toggle is on and an event was just detected.
     WebKit only runs nodes that have a path to the speakers, so both hang off
     a zero-gain node into the destination: pulled, never heard. */
  _sampleAudio() {
    if (!this._analyser) return;
    /* Float, never the Byte variants: getByteTimeDomainData quantises to 8 bits,
       putting the usable noise floor near -48 dBFS — above a quiet bedroom — so
       a whole night would flatten to a constant. */
    this._analyser.getFloatTimeDomainData(this._time);
    let sum = 0, pk = 0;
    for (let i = 0; i < this._time.length; i++) { const d = this._time[i]; sum += d * d; if (Math.abs(d) > pk) pk = Math.abs(d); }
    const rms = Math.sqrt(sum / this._time.length);
    const db = 20 * Math.log10(Math.max(rms, 1e-7));       // true dBFS, ~-140..0
    this.level = db; this._lastLevelAt = Date.now();
    if (rms > 0) this._heardAt = Date.now();
    if (!this._cur) return;
    this._analyser.getFloatFrequencyData(this._freq);      // dB per bin, not 0-255
    const nyq = this._ac.sampleRate / 2, bins = this._freq.length;
    const lo = Math.floor(60 / nyq * bins), hi = Math.ceil(500 / nyq * bins);
    let bandDb = -140, cnt = 0, acc = 0;
    for (let i = lo; i < hi && i < bins; i++) { const v = this._freq[i]; if (isFinite(v)) { acc += v; cnt++; } }
    bandDb = cnt ? acc / cnt : -140;
    /* map dB back onto the 0-255 scale the staging thresholds are written against */
    const band = clamp((bandDb + 100) / 70 * 255, 0, 255);
    const peakDb = 20 * Math.log10(Math.max(pk, 1e-7));
    this._cur.aSum += db;
    this._cur.aPeak = Math.max(this._cur.aPeak, peakDb);
    this._cur.aBand = Math.max(this._cur.aBand, band);
    this._cur.aN++;
  },

  _newEpoch(t) { return { t, mSum: 0, mPeak: 0, mN: 0, aSum: 0, aPeak: -140, aBand: 0, aN: 0, sc: 0, sk: 0, so: 0, sf: 0 }; },

  _closeEpoch() {
    if (!this._cur) return;
    const c = this._cur;
    const e = {
      t: c.t,
      m: c.mN ? +(c.mSum / c.mN * 1000).toFixed(2) : null,   // mean rectified motion, scaled
      mp: c.mN ? +(c.mPeak * 1000).toFixed(2) : null,        // peak within the epoch
      a: c.aN ? Math.round(c.aSum / c.aN) : null,            // mean dBFS
      ap: c.aN ? Math.round(c.aPeak) : null,                 // peak dBFS
      ab: c.aN ? Math.round(c.aBand) : null,                 // 60-500Hz band energy 0..255
    };
    /* sound events in this epoch, from the worklet path (absent without it) */
    if (this._worklet) { e.sc = c.sc; e.sk = c.sk; e.so = c.so; }   // coughs, snores, other
    this._epochs.push(e);
    if (this.onEpoch) { try { this.onEpoch(e, this._epochs); } catch (_) {} }
  },

  /* one place that builds the audio graph, for start() and for a context rebuild */
  async _attachAudio() {
    const ac = this._ac = Alarm.ctx();                       // share one context with the alarm
    const src = ac.createMediaStreamSource(this._stream);
    this._analyser = ac.createAnalyser();
    this._analyser.fftSize = 2048;
    this._analyser.smoothingTimeConstant = 0.4;
    this._freq = new Float32Array(this._analyser.frequencyBinCount);
    this._time = new Float32Array(this._analyser.fftSize);
    /* the pull: analyser (and worklet) → gain 0 → speakers. Silent, but it is
       what makes WebKit actually run the graph. Without it Safari hands the
       analyser silence. */
    const mute = ac.createGain(); mute.gain.value = 0;
    src.connect(this._analyser); this._analyser.connect(mute); mute.connect(ac.destination);
    this._src = src; this._mute = mute;
    this._worklet = null;
    if (ac.audioWorklet && typeof AudioWorkletNode === 'function') {
      try {
        if (this._workletCtx !== ac) { await ac.audioWorklet.addModule('sound-worklet.js'); this._workletCtx = ac; }
        const node = new AudioWorkletNode(ac, 'small-hours-sound', { numberOfInputs: 1, numberOfOutputs: 1, outputChannelCount: [1] });
        node.port.onmessage = (m) => this._onFrame(m.data);
        src.connect(node); node.connect(mute);
        this._worklet = node;
        this._sr8 = 8000;
      } catch (e) { this._worklet = null; this.workletWhy = String(e && e.message || e); }
    }
    try { const p = ac.resume(); if (p && p.catch) p.catch(() => {}); } catch (_) {}
  },

  /* Raw first: echo cancelling and noise suppression are built to delete
     exactly the steady low sounds (snoring) we are listening for. Some
     devices open a raw track that only ever carries zeros, though, so
     `plain` asks for the browser's default track instead — see the
     silence watchdog in start() and the retry in soundCheck(). */
  _openMic(plain) {
    return navigator.mediaDevices.getUserMedia(plain ? { audio: true } : {
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
    });
  },

  /* A track that opened but has carried nothing but digital zeros for a few
     seconds: reopen it once with the browser's default settings. */
  async _reopenPlain() {
    if (this._plain || !this._stream) return;
    this._plain = true;
    try {
      const s = await this._openMic(true);
      this._stream.getTracks().forEach(t => t.stop());
      this._stream = s;
      this._detach();
      await this._attachAudio();
    } catch (_) {}
  },

  /* --- worklet frames → detector → epoch counts (+ clips) ----------------- */
  _onFrame(f) {
    if (!f || f.hello) return;
    this.frames++;
    this.frameLevel = f.db; this._heardAt = Date.now();
    if (f.pcm) this._ring.push(f.pcm);
    if (this._ring.length > 60) this._ring.shift();          // 60 × 50 ms = 3 s
    if (!this._det) return;
    /* time each frame by its index on the audio clock, so message batching on
       a busy main thread cannot bunch up the breathing rhythm */
    if (this._fBase == null || f.i < this._fLast) this._fBase = Date.now() - f.i * SoundEvents.FRAME_MS;
    this._fLast = f.i;
    const t = this._fBase + f.i * SoundEvents.FRAME_MS;
    this._fNow = t;
    for (const ev of SoundEvents.push(this._det, f, t)) this._onEvent(ev);
    if (this._pendingClip) this._feedClip(f.pcm);
  },

  _onEvent(ev) {
    if (ev.type === 'pending') return;
    this.events.push({ t: ev.t, type: ev.type, dur: ev.dur, peak: ev.peak });
    if (this.events.length > 4000) this.events.shift();
    const c = this._cur;
    if (c && ev.t >= c.t) { if (ev.type === 'cough') c.sc++; else if (ev.type === 'snore') c.sk++; else c.so++; }
    else {                                                    // landed in an already-closed epoch (a late-confirmed snore)
      const e = this._epochs.slice().reverse().find(x => ev.t >= x.t && ev.t < x.t + EPOCH_MS);
      if (e && e.sc != null) { if (ev.type === 'cough') e.sc++; else if (ev.type === 'snore') e.sk++; else e.so++; }
    }
    if (this.onSound) { try { this.onSound(ev); } catch (_) {} }
    if (this.saveClips && !ev.late && !this._pendingClip) {
      /* 0.5 s before the event's start is already in the ring; collect until
         1 s after its end, capped at 4 s */
      const framesBack = Math.ceil(((this._fNow || Date.now()) - ev.t) / SoundEvents.FRAME_MS) + 10;
      const pre = this._ring.slice(-Math.min(this._ring.length, framesBack));
      this._pendingClip = { ev, chunks: pre, need: 20, max: 80 };
    }
  },

  _feedClip(pcm) {
    const p = this._pendingClip;
    p.chunks.push(pcm);
    if (--p.need > 0 && p.chunks.length < p.max) return;
    this._pendingClip = null;
    const chunks = p.chunks.slice(-p.max);
    const n = chunks.reduce((s, c) => s + c.length, 0), all = new Int16Array(n);
    let o = 0; for (const c of chunks) { all.set(c, o); o += c.length; }
    Clips.save({ t: p.ev.t, type: p.ev.type, peak: p.ev.peak, dur: p.ev.dur, night: this._t0, sr: 8000, pcm: all }).catch(() => {});
  },

  async start() {
    this._epochs = []; this._lastMag = null; this._hp = 0;
    this._t0 = Date.now();
    this._cur = this._newEpoch(this._t0);
    this.events = []; this.frames = 0; this._ring = []; this._pendingClip = null; this._fBase = null; this._fLast = -1;
    this._det = SoundEvents.create();
    this.audioWhy = '';
    this._plain = false; this._everHeard = false; this._micAt = 0;

    await this._holdWake();
    document.addEventListener('visibilitychange', this._wakeHandler);

    if (this.motionOK) {
      this._boundMotion = this._onMotion.bind(this);
      window.addEventListener('devicemotion', this._boundMotion);
    }

    if (this.audioOK) {
      try {
        this._stream = this._premic ? await this._premic : await this._openMic(this._plainPref);
        if (this._plainPref) this._plain = true;
        this._premic = null;
        await this._attachAudio();
        this._micAt = Date.now();
      } catch (e) {
        this.audioOK = false;
        this.audioWhy = e && e.name === 'NotAllowedError' ? 'Microphone access was declined, so tonight is movement only.' : 'The microphone could not be opened, so tonight is movement only.';
        if (this._stream) { this._stream.getTracks().forEach(t => t.stop()); this._stream = null; }
      }
    }

    /* Self-correcting clock: schedule against wall time so 8 hours of timer
       throttling cannot accumulate drift. */
    const tick = () => {
      const now = Date.now();
      if (this.audioOK) {
        /* iOS can drop the shared context to suspended/interrupted after the
           mic opens or a notification; ask for it back */
        if (this._ac && this._ac.state !== 'running') Alarm.recover();
        this._sampleAudio();
        if (this.frameLevel > -135 || this.level > -135) this._everHeard = true;
        if (!this._everHeard && !this._plain && this._micAt && now - this._micAt > 4000) this._reopenPlain();
      }
      while (this._cur && now - this._cur.t >= EPOCH_MS) {
        const nextT = this._cur.t + EPOCH_MS;
        this._closeEpoch();
        this._cur = this._newEpoch(nextT);
      }
      this._tickId = setTimeout(tick, 250);
    };
    this._tickId = setTimeout(tick, 250);
    return true;
  },

  _detach() {
    if (this._worklet) { try { this._worklet.port.onmessage = null; this._worklet.disconnect(); } catch (_) {} this._worklet = null; }
    for (const n of [this._src, this._analyser, this._mute]) { if (n) try { n.disconnect(); } catch (_) {} }
    this._src = null; this._mute = null; this._analyser = null;
  },

  stop() {
    if (this._det) for (const ev of SoundEvents.flush(this._det)) this._onEvent(ev);
    if (this._cur && this._cur.mN + this._cur.aN > 0) this._closeEpoch();
    this._cur = null; this._det = null;
    clearTimeout(this._tickId); this._tickId = null;
    if (this._boundMotion) window.removeEventListener('devicemotion', this._boundMotion);

     rebuild that context, our source, analyser and worklet died with the old
     one — so re-point them at the new context and let the night carry on. */
  reattachAudio() {
    if (!this.audioOK || !this._stream || !this._cur) return;
    this._detach();

  },

  /* Hand the audio session back to the OS. The alarm calls this before it
     sounds, so playback is not stuck on the record route (earpiece, quiet). */
  releaseMic() {
    if (this._det) for (const ev of SoundEvents.flush(this._det)) this._onEvent(ev);
    this._pendingClip = null;
    if (this._stream) { this._stream.getTracks().forEach(t => t.stop()); this._stream = null; }
    this._detach(); this._ring = [];
    this.audioOK = false;
  },

  /* --- sound check: a few seconds of live level on the home screen -------- */
  async soundCheck(onLevel, ms = 5000, plain = false) {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return { ok: false, why: 'No microphone API in this browser.' };
    let stream;
    try { stream = await this._openMic(plain); }
    catch (e) { return { ok: false, why: e && e.name === 'NotAllowedError' ? 'Microphone access was declined. Allow it for this site in the browser settings, then try again.' : 'The microphone could not be opened' + (window.isSecureContext ? '.' : ' — it needs the page served over HTTPS.') }; }

    const t0 = Date.now();
    await new Promise(done => {
      const step = () => {
        an.getFloatTimeDomainData(buf);
        let s = 0; for (let i = 0; i < buf.length; i++) s += buf[i] * buf[i];
        const db = 20 * Math.log10(Math.max(Math.sqrt(s / buf.length), 1e-7));
        /* skip the digital zeros a mic sends while it wakes up: they are not the room */
        if (db > -139) { n++; if (db < min) min = db; if (db > max) max = db; }
        try { onLevel && onLevel(db, (Date.now() - t0) / ms); } catch (_) {}
        if (Date.now() - t0 < ms) setTimeout(step, 80); else done();
      };
      step();
    });
    for (const x of [src, an, mute]) try { x.disconnect(); } catch (_) {}
    stream.getTracks().forEach(t => t.stop());
    if (max <= -139 && !plain) { const r = await this.soundCheck(onLevel, ms, true); if (r.ok) { r.plain = true; this._plainPref = true; } return r; }
    if (max <= -139) return { ok: false, why: 'The microphone opened but sent only silence. Close other apps using it, reload the page and try again.', state: ac.state };
    return { ok: true, min: Math.round(min), max: Math.round(max), range: Math.round(max - min), state: ac.state };
  },

  epochs() { return this._epochs; },
};

/* ============================================================================

      gaps of up to 150 ms.

  },

  create(over) {
    return {
      P: { ...this.P, ...(over || {}) },
      n: 0, sec: [], secLo: [], secHi: [], hist: [], histLo: [], histHi: [],
      floor: null, floorLo: null, floorHi: null,
      cur: null, quiet: 0, cands: [], lastCough: -1e9, fit: 0, fits: 0,
    };
  },

  _pct(a, p) { if (!a.length) return null; const s = a.slice().sort((x, y) => x - y); return s[Math.min(s.length - 1, Math.max(0, Math.floor(p * (s.length - 1))))]; },
  _med(a) { return this._pct(a, 0.5); },
  _pow(a, k) { let s = 0; for (const f of a) s += Math.pow(10, f[k] / 10); return 10 * Math.log10(Math.max(s / a.length, 1e-14)); },

  /* One frame in; returns finished events (usually none). tMs: frame start
     time on any clock — the app passes Date.now()-based times. */

    const P = d.P, out = [];
    d.n++;
    d.sec.push(f.db); d.secLo.push(f.lo); d.secHi.push(f.hi);
    if (d.sec.length >= 1000 / this.FRAME_MS) {
      d.hist.push(this._med(d.sec)); d.histLo.push(this._med(d.secLo)); d.histHi.push(this._med(d.secHi));
      for (const h of [d.hist, d.histLo, d.histHi]) if (h.length > P.floorSecs) h.shift();

      const pct = d.hist.length >= 5 ? P.floorPct : 0;
      d.floor = Math.max(P.floorMin, this._pct(d.hist, pct));
      d.floorLo = Math.max(P.floorMin, this._pct(d.histLo, pct));
      d.floorHi = Math.max(P.floorMin, this._pct(d.histHi, pct));

      if (!d.cur) d.cur = { t: tMs, frames: [], floor: d.floor, floorLo: d.floorLo, floorHi: d.floorHi, active: 0 };

  /* close any open event (end of night) */
  flush(d) { return d.cur ? this._close(d) : []; },

  describe(ev) {
    const fr = ev.frames, n = fr.length; let pk = 0;
    for (let i = 1; i < n; i++) if (fr[i].db > fr[pk].db) pk = i;
    let zc = 0, vo = 0, hiMax = -200, loMax = -200, m = 0, m2 = 0;
    for (const f of fr) { zc += f.zcr || 0; vo += f.vo || 0; if (f.hi > hiMax) hiMax = f.hi; if (f.lo > loMax) loMax = f.lo; m += f.db; m2 += f.db * f.db; }
    /* decay: frames after the peak until 10 dB down; subpeaks: local maxima 6 dB over their dip */
    let dec = n - pk; for (let i = pk + 1; i < n; i++) if (fr[i].db < fr[pk].db - 10) { dec = i - pk; break; }
    let sub = 0, dip = fr[0].db, up = true;
    for (let i = 1; i < n; i++) { const v = fr[i].db; if (up && v < fr[i - 1].db) { if (fr[i - 1].db - dip >= 6) sub++; up = false; dip = v; } else if (!up) { if (v < dip) dip = v; if (v > dip + 3) up = true; } }

       whole event and at the peak frame */
    const shape = [], pshape = [];
    const hasB = fr[0].b && fr[0].b.length === 6;
    if (hasB) {
      const tot = this._pow(fr, 'db');
      for (let k = 0; k < 6; k++) { let s = 0; for (const f of fr) s += Math.pow(10, f.b[k] / 10); shape.push(10 * Math.log10(Math.max(s / n, 1e-14)) - tot); pshape.push(fr[pk].b[k] - fr[pk].db); }

       cough opens with a broadband burst, then a softer tail), how long the
       sound stays within 6 dB of its peak, and the voicing at the peak */
    const eshape = [];
    if (hasB && n >= 3) {
      const head = fr.slice(0, Math.min(2, n - 1)), tail = fr.slice(Math.min(2, n - 1));
      for (let k = 0; k < 6; k++) {
        let h = 0, t = 0; for (const f of head) h += Math.pow(10, f.b[k] / 10); for (const f of tail) t += Math.pow(10, f.b[k] / 10);

      peakDb: fr[pk].db,

      lohi: +(this._pow(fr, 'lo') - this._pow(fr, 'hi')).toFixed(1),

      zcr: +(zc / n).toFixed(3), vo: +(vo / n).toFixed(2), fill: +(ev.active / n).toFixed(2),

  features(e) {

     dip that falls SPLIT dB below the peaks on both sides, so each burst is
     judged on its own. */
  split(ev, dB) {
    const fr = ev.frames, n = fr.length, cuts = [];
    let i = 0;
    while (i < n) {
      let pk = i; while (pk + 1 < n && fr[pk + 1].db >= fr[pk].db) pk++;          // climb to a peak
      let v = pk; while (v + 1 < n && fr[v + 1].db <= fr[v].db) v++;               // fall to a valley
      if (v >= n - 1) break;
      let pk2 = v; while (pk2 + 1 < n && fr[pk2 + 1].db >= fr[pk2].db) pk2++;
      let maxL = -200; for (let k = (cuts.length ? cuts[cuts.length - 1] : 0); k <= pk; k++) maxL = Math.max(maxL, fr[k].db);
      if (maxL - fr[v].db >= dB && fr[pk2].db - fr[v].db >= dB) cuts.push(v);
      i = v + 1;
    }
    if (!cuts.length) return [ev];
    const out = []; let a = 0;
    for (const c of [...cuts, n]) {
      const frames = fr.slice(a, c);
      if (frames.length) out.push({ ...ev, t: ev.t + a * this.FRAME_MS, frames, active: frames.length });
      a = c;
    }
    return out;
  },

  _close(d) {
    const ev = d.cur; d.cur = null; d.quiet = 0;
    const out = [];
    for (const part of this.split(ev, d.P.split)) out.push(...this._classify(d, part));
    return out;
  },

  _classify(d, ev) {
    const P = d.P;
    const e = this.describe(ev), out = [];
    if (this.isCough(e, P)) {
      e.type = 'cough';
      if (e.t - d.lastCough <= P.fitGap) { d.fit++; if (d.fit === P.fitMin) { d.fits++; e.fitStart = true; } }
      else d.fit = 1;
      d.lastCough = e.t;
      out.push(e);
      return out;
    }
    if (this.isSnoreLike(e, P)) {
      /* a snore is only a snore when it repeats at breathing pace */
      d.cands = d.cands.filter(c => e.t - c.t <= P.ioiMax * (P.trainMin + 1));
      const prev = d.cands[d.cands.length - 1];
      if (prev && e.t - prev.t > P.ioiMax) d.cands = [];
      if (prev && e.t - prev.t < P.ioiMin) { e.type = 'other'; out.push(e); return out; }  // too fast to be breaths
      d.cands.push(e);
      const run = d.cands.slice(-P.trainMin);
      if (run.length >= P.trainMin) {
        const ioi = []; for (let i = 1; i < run.length; i++) ioi.push(run[i].t - run[i - 1].t);
        const m = ioi.reduce((s, v) => s + v, 0) / ioi.length;
        const sd = Math.sqrt(ioi.reduce((s, v) => s + (v - m) * (v - m), 0) / ioi.length);
        if (ioi.every(v => v >= P.ioiMin && v <= P.ioiMax) && sd / m <= P.ioiCV) {
          /* confirm the whole run; earlier members were held back as pending */
          for (const c of run) if (c.type !== 'snore') { c.type = 'snore'; if (c !== e) { c.late = true; out.push(c); } }
          e.type = 'snore'; out.push(e);
          return out;
        }
      }
      e.type = 'pending';                                     // may become a snore when the next breath lands
      out.push(e);
      return out;
    }
    e.type = 'other';
    out.push(e);
    return out;
  },

  /* Night summary from the classified event list. snoreMin counts the 30 s
     epochs that hold at least one confirmed snore. */
  summarize(events, epochMs) {
    const ep = new Set(); let coughs = 0, other = 0, fits = 0, lastC = -1e9, run = 0;
    const P = this.P;
    for (const e of events.slice().sort((a, b) => a.t - b.t)) {
      if (e.type === 'snore') ep.add(Math.floor(e.t / epochMs));
      else if (e.type === 'cough') {
        coughs++;
        if (e.t - lastC <= P.fitGap) { run++; if (run === P.fitMin) fits++; } else run = 1;
        lastC = e.t;
      } else if (e.type === 'other') other++;
    }
    return { snoreMin: +(ep.size * epochMs / 60000).toFixed(1), coughs, fits, other };
  },
};

<script>
/* ============================================================================
   ALARM — wake window logic + Web Audio synthesis
   No sound files: every tone here is synthesised, so the page stays one
   self-contained file and works offline.

   Two iOS traps this is built around:
   1. A live getUserMedia stream puts the audio session in a record category,
      which can route playback to the earpiece at low volume. So the mic is
      RELEASED before the alarm sounds.
   2. Web Audio output is subject to the hardware silent switch. Routing the
      graph through a MediaStreamDestination into an <audio> element puts it on
      the media path, which behaves better. We do both: direct and routed.
   Neither is a guarantee. The app tells the user to keep a normal iOS alarm as
   a backstop, because a silent alarm is the one unforgivable bug.
   ========================================================================== */
/* WebKit has a third AudioContext state beyond 'running' and 'suspended':
   'interrupted', entered when a call, Siri, an alarm or another app takes the
   audio session. resume() does not reliably bring an interrupted context back,
   so past this long we stop asking and rebuild the whole thing. */
const ALARM_STALL_MS = 20000;

const Alarm = {
  _ac: null, _el: null, _dest: null, _keepAlive: null,
  _timer: null, _ringing: false, _startedAt: 0, _seq: 0,
  _stalledAt: 0, _lastResume: 0, _wakeBound: false,
  target: null, windowMin: 30, armed: false, firedAt: null,
  onFire: null, onTick: null,

  ctx() {
    if (!this._ac) {
      const C = window.AudioContext || window.webkitAudioContext;
      this._ac = new C();
      const ac = this._ac;
      ac.onstatechange = () => {
        if (ac !== this._ac) return;          // an old context winding down
        this._noteState();
        if (ac.state !== 'running') this.recover();
      };
    }
    return this._ac;
  },

  /* Must be called from a real tap at bedtime. Unlocks audio and proves it. */
  async unlock() {
    const ac = this.ctx();
    /* resume() can stay pending forever when the browser does not count the
       call as a user gesture. Never let that stop the night from starting:
       recover() keeps retrying on every later wake event and tap. */
    try {
      if (ac.state !== 'running') await Promise.race([ac.resume(), new Promise(r => setTimeout(r, 1500))]);
    } catch (_) {}

    /* media-path routing, so the silent switch is less likely to kill it */
    if (!this._dest) {
      try {
        this._dest = ac.createMediaStreamDestination();
        this._el = document.createElement('audio');
        this._el.srcObject = this._dest.stream;
        this._el.loop = true;
        this._el.setAttribute('playsinline', '');
        this._el.volume = 1;
        document.body.appendChild(this._el);
        this._play();
      } catch (_) { this._dest = null; }
    }

    if (!this._keepAlive) {
      try {
        const o = ac.createOscillator(), g = ac.createGain();
        o.frequency.value = 30; g.gain.value = 0.0001;
        o.connect(g); g.connect(ac.destination);
        if (this._dest) g.connect(this._dest);
        o.start();
        this._keepAlive = o;
      } catch (_) {}
    }

    this._bindWake();
    return ac.state === 'running';
  },

  /* --- surviving an interruption -------------------------------------------
     unlock() runs again on every bedtime and every Test tap, so these bind
     once. Any one of them may be the only signal that the audio session is
     ours again; touchend is the last resort, and the only one that carries a
     real gesture — which is what iOS wants before it will start a context. */
  _bindWake() {
    if (this._wakeBound) return;
    this._wakeBound = true;
    const go = () => this.recover();
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') go();
    });
    window.addEventListener('pageshow', go);
    window.addEventListener('focus', go);
    document.addEventListener('touchend', go, { passive: true });
  },

  _noteState() {
    if (!this._ac) return;
    if (this._ac.state === 'running') this._stalledAt = 0;
    else if (!this._stalledAt) this._stalledAt = Date.now();
  },

  /* Safe to call at any time, from anything. Cheap when all is well. */
  recover() {
    if (!this._ac) return;
    if (this._ac.state === 'running') { this._stalledAt = 0; this._play(); return; }
    this._noteState();
    if (Date.now() - this._stalledAt > ALARM_STALL_MS) { this._rebuild(); return; }
    const now = Date.now();
    if (now - this._lastResume < 400) return;      // wake events arrive in clusters
    this._lastResume = now;

       inside a wake handler would take the rest of the recovery down with it.
       Clear the stall clock off the promise too: statechange is the signal we
       trust least, and a missed one would leave a stale clock that rebuilds a
       perfectly healthy context on the next brief interruption. */
    try {
      const p = this._ac.resume();
      if (p && p.then) p.then(() => this._noteState(), () => {});
    } catch (_) {}
    this._play();
  },

  /* play() is undefined on the same old WebKit, and unlock() must not treat a
     throw from it as "the media path failed". */
  _play() {
    if (!this._el || !this._el.paused) return;
    try { const p = this._el.play(); if (p && p.catch) p.catch(() => {}); } catch (_) {}
  },

  /* The context is not coming back. Throw it away and build a new one — the
     media element, the keep-alive tone and Signal's analyser all hang off the
     dead one, so they are rebuilt too. */
  _rebuild() {
    const old = this._ac, wasRinging = this._ringing;
    const elapsed = (this.firedAt ? (Date.now() - this.firedAt) : 0) / 1000;
    if (old) {
      old.onstatechange = null;
      try { const c = old.close(); if (c && c.catch) c.catch(() => {}); } catch (_) {}
    }
    this._ac = null; this._dest = null; this._keepAlive = null;
    this._stalledAt = 0; this._lastResume = 0;
    if (this._el) {
      try { this._el.pause(); } catch (_) {}
      try { this._el.remove(); } catch (_) {}
      this._el = null;
    }
    this.unlock();                                 // rebuilds ctx, dest, element, keep-alive
    try { Signal.reattachAudio(); } catch (_) {}
    /* keep the escalation where it was — the new context's clock starts at 0 */
    if (wasRinging) this._startedAt = this.ctx().currentTime - elapsed;
  },

  /* A short test chime, so bedtime proves the alarm can actually make noise. */
  test() { this._chime(0.5, 0); return true; },

  /* One warm bell: fundamental plus two harmonics, exponential decay. */
  _chime(peak, when) {
    const ac = this.ctx();
    const t = ac.currentTime + (when || 0);
    const bus = ac.createGain();
    bus.gain.value = 1;
    bus.connect(ac.destination);
    if (this._dest) bus.connect(this._dest);
    [[1, 1], [2.01, 0.32], [3.02, 0.14]].forEach(([mult, amp]) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'sine';
      o.frequency.value = 440 * mult;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak * amp), t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 2.4);
      o.connect(g); g.connect(bus);
      o.start(t); o.stop(t + 2.5);
    });
  },

  /* Escalation: gentle at second 0, unignorable by second 90. */
  _escalate() {
    if (!this._ringing) return;
    const ac = this.ctx();
    const elapsed = (ac.currentTime - this._startedAt);
    const ramp = clamp(elapsed / 90, 0, 1);
    const peak = 0.04 + 0.66 * ramp * ramp;
    this._chime(peak, 0);
    if (ramp > 0.55) this._chime(peak * 0.7, 0.28);      // doubles up when it means it
    const gap = lerp(5.5, 1.4, ramp);
    this._seq++;
    this._timer = setTimeout(() => this._escalate(), gap * 1000);
    if (this.onTick) { try { this.onTick(elapsed, ramp); } catch (_) {} }
  },

  async fire() {
    if (this._ringing) return;
    this._ringing = true;
    this.firedAt = Date.now();
    /* Trap 1: hand the audio session back before making noise. */
    try { Signal.releaseMic(); } catch (_) {}
    const ac = this.ctx();
    try { if (ac.state !== 'running') await ac.resume(); } catch (_) {}
    /* Still not running: do not sit out the stall window. A silent alarm is
       the one unforgivable bug, so rebuild here and now. */
    if (this._ac.state !== 'running') this._rebuild();
    this._play();
    this._startedAt = this.ctx().currentTime;
    this._seq = 0;
    document.body.classList.add('ringing');
    if (this.onFire) { try { this.onFire(); } catch (_) {} }
    this._escalate();
  },

  silence() {
    this._ringing = false;
    clearTimeout(this._timer); this._timer = null;
    document.body.classList.remove('ringing');
  },

  /* --- the wake window ------------------------------------------------------
     Window is [target - windowMin, target]. Inside it we look for a rise out of
     deep sleep: the current epoch's motion above the night's own light-sleep
     threshold, or a sustained upward trend. If the whole window passes in deep
     sleep, the deadline fires regardless. Never late. */
  shouldFire(epochs, now) {
    if (!this.armed || !this.target || this._ringing) return false;
    if (now >= this.target) return true;                        // hard deadline
    const open = this.target - this.windowMin * 60000;
    if (now < open) return false;
    if (!epochs || epochs.length < 20) return false;            // not enough night to judge

    const recent = epochs.slice(-6).filter(e => e.m != null);
    if (recent.length < 3) return false;

    /* Night-relative thresholds: absolute values are meaningless because they
       depend on the mattress, the phone, and where it was placed. */
    const vals = epochs.map(e => e.m).filter(v => v != null).sort((a, b) => a - b);
    if (vals.length < 20) return false;
    const q = p => vals[clamp(Math.floor(p * (vals.length - 1)), 0, vals.length - 1)];
    const floor = q(0.20), light = q(0.75);
    const span = Math.max(light - floor, 1e-6);

    const cur = recent.slice(-3).reduce((s, e) => s + e.m, 0) / 3;
    const norm = (cur - floor) / span;
    if (norm >= 0.85) return true;                              // clearly stirring

    /* a sustained climb, even if it has not crossed yet */
    const first = recent.slice(0, 3).reduce((s, e) => s + e.m, 0) / 3;
    const rising = (cur - first) / span;
    const frac = (now - open) / (this.windowMin * 60000);
    if (rising > 0.3 && norm > 0.5 && frac > 0.25) return true;

    /* late in the window, accept a weaker signal rather than lose the chance */
    if (frac > 0.75 && norm >= 0.6) return true;
    return false;
  },
};
